[workspace]
members = [
    "crates/gfabasic-compiler",
    "crates/gfabasic-runtime",
    "crates/gfabasic-platform-linux",
    "crates/gfabasic-lsp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
