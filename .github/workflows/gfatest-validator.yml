name: GFATEST protocol validator

on:
  pull_request:
    paths:
      - "scripts/validate_gfatest_results.py"
      - "scripts/tests/test_validate_gfatest_results.py"
      - ".github/workflows/gfatest-validator.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/validate_gfatest_results.py"
      - "scripts/tests/test_validate_gfatest_results.py"
      - ".github/workflows/gfatest-validator.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: GFATEST validator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run GFATEST validator tests
        run: python -m unittest discover -s scripts/tests -p "test_validate_gfatest_results.py" -v
