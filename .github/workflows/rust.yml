name: Rust checks

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "api/**"
      - "tests/corpus/amiga/3.5/combinatorics/**"
      - "tests/corpus/amiga/3.5/matrix/**"
      - "tests/corpus/amiga/3.5/data/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate every GitHub Actions workflow
        run: |
          mapfile -t workflow_files < <(find .github/workflows -type f \\( -name '*.yml' -o -name '*.yaml' \\) -print | sort)
          test "${#workflow_files[@]}" -gt 0
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 "${workflow_files[@]}"

      - name: Check shell syntax in repository scripts
        run: |
          mapfile -t shell_files < <(find scripts -type f -name '*.sh' -print | sort)
          if [ "${#shell_files[@]}" -gt 0 ]; then
            bash -n "${shell_files[@]}"
          fi

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rustup-1.99.1-minimal-rustfmt-clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.99.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.99.1-

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Check verified Amiga 3.5 formatter fixtures
        run: |
          for source in tests/corpus/amiga/3.5/combinatorics/*.lst tests/corpus/amiga/3.5/matrix/*.lst; do
            cargo run --quiet -p gfabasic-compiler -- fmt --check "$source"
          done

      - name: Build workspace
        run: cargo build --workspace --all-targets
