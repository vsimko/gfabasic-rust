name: Refresh public PDF source locator index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-public-pdf-index.yml"
      - "scripts/build_reference_source_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-pdf-source-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PDF metadata reader
        run: python -m pip install --disable-pip-version-check "pypdf>=5.0,<7.0"

      - name: Download reference PDFs to ephemeral runner storage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gfa-reference-input"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://ia803204.us.archive.org/16/items/gfa-basic-3.5-interpreter/GFA_Basic_3.5_Interpreter.pdf" \
            --output "$RUNNER_TEMP/gfa-reference-input/GFA_Basic_3.5_Interpreter.pdf"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://retro-commodore.eu/files/downloads/amigamanuals-xiik.net/eBooks/Das%20Grosse%20Buch%20zu%20GFA-Basic%20Amiga%20%28OCR%29%20-%20eBook-DE.pdf" \
            --output "$RUNNER_TEMP/gfa-reference-input/Das-Grosse-Buch-zu-GFA-BASIC-Amiga.pdf"
          for pdf in "$RUNNER_TEMP"/gfa-reference-input/*.pdf; do
            test "$(head -c 5 "$pdf")" = "%PDF-"
            test -s "$pdf"
          done

      - name: Build locator-only index
        run: |
          set -euo pipefail
          python scripts/build_reference_source_index.py \
            --english "$RUNNER_TEMP/gfa-reference-input/GFA_Basic_3.5_Interpreter.pdf" \
            --german "$RUNNER_TEMP/gfa-reference-input/Das-Grosse-Buch-zu-GFA-BASIC-Amiga.pdf" \
            --english-url "https://ia803204.us.archive.org/16/items/gfa-basic-3.5-interpreter/GFA_Basic_3.5_Interpreter.pdf" \
            --german-url "https://retro-commodore.eu/files/downloads/amigamanuals-xiik.net/eBooks/Das%20Grosse%20Buch%20zu%20GFA-Basic%20Amiga%20%28OCR%29%20-%20eBook-DE.pdf" \
            --output references/source-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("references/source-index.json").read_text())
          assert len(data["documents"]) == 2
          assert all(d["page_count"] > 0 and len(d["sha256"]) == 64 for d in data["documents"])
          assert all("page_locators" in d for d in data["documents"])
          assert all("text" not in page for d in data["documents"] for page in d["page_locators"])
          print("Validated locator-only index:", [(d["source_id"], d["page_count"]) for d in data["documents"]])
          PY

      - name: Commit public source index
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gfa-reference-input"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/source-index.json
          if git diff --cached --quiet; then
            echo "Source index is already current."
            exit 0
          fi
          git commit -m "Refresh public GFA BASIC source locator index"
          git push
