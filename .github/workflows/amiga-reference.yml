name: Prepare and analyze Amiga GFA-BASIC reference interpreter

on:
  workflow_dispatch:
    inputs:
      publish_private_analysis:
        description: "Explicitly approve replacing generated analysis on the private repository main branch and creating/updating a private GitHub Release."
        required: false
        default: false
        type: boolean
      publish_public_analysis:
        description: "Explicitly approve pushing the public analysis branch and creating/updating its public pull request."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: amiga-reference-assets
  cancel-in-progress: false

jobs:
  prepare-and-analyze:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    name: Fetch, verify, and analyze GFA BASIC 3.52
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out analysis scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Cache analysis apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-ubuntu-24.04-amiga-analysis-apt-${{ hashFiles('.github/workflows/amiga-reference.yml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-amiga-analysis-apt-

      - name: Cache Python wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-amiga-analysis-pip-${{ hashFiles('.github/workflows/amiga-reference.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-amiga-analysis-pip-

      - name: Prepare dependency cache directories
        run: mkdir -p "$RUNNER_TEMP/apt-archives/partial" "$HOME/.cache/pip"

      - name: Preflight private interpreter archive path
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: >-
          python scripts/check_private_github_assets.py --repo vsimko/gfabasic-private-assets --ref main --path "GFA-BASIC v3.52 (1990)(GFA Systemtechnik)(DE)(Disk 1 of 2)[WB].zip"

      - name: Download and extract the approved 3.52 disk image
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN" || {
            echo "::error::GFA_ASSETS_TOKEN is not configured."
            exit 1
          }
          mkdir -p analysis-input analysis-output
          ARCHIVE_NAME='GFA-BASIC v3.52 (1990)(GFA Systemtechnik)(DE)(Disk 1 of 2)[WB].zip'
          python3 - "$ARCHIVE_NAME" "$RUNNER_TEMP/gfa-basic-3.52-disk1.zip" <<'PY'
          import os
          import shutil
          import sys
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          filename, destination = sys.argv[1:]
          url = f"https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/{quote(filename, safe='')}?ref=main"
          request = Request(url, headers={
              "Authorization": f"Bearer {os.environ['GFA_ASSETS_TOKEN']}",
              "Accept": "application/vnd.github.raw",
          })
          with urlopen(request, timeout=60) as response, open(destination, "wb") as output:
              shutil.copyfileobj(response, output)
          PY
          python3 - "$RUNNER_TEMP/gfa-basic-3.52-disk1.zip" "$RUNNER_TEMP/gfa-basic-3.52-disk1.adf" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              members = [name for name in archive.namelist() if name.lower().endswith(".adf")]
              if len(members) != 1:
                  raise SystemExit(f"Expected exactly one ADF in approved archive; found {len(members)}")
              with archive.open(members[0]) as source, open(sys.argv[2], "wb") as target:
                  while chunk := source.read(1024 * 1024):
                      target.write(chunk)
          PY

      - name: Install Java and analysis utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives/" openjdk-21-jdk unzip jq python3 python3-pip
          python3 -m pip install --cache-dir "$HOME/.cache/pip" --break-system-packages amitools
          java -version

      - name: Extract interpreter from the approved 3.52 ADF
        run: |
          set -euo pipefail
          xdftool "$RUNNER_TEMP/gfa-basic-3.52-disk1.adf" read GFABasic analysis-input/GFABasic

      - name: Verify binary identity and Amiga executable header
        run: |
          set -euo pipefail
          cd analysis-input
          echo "fd80f6093e8d0163856af5849121e945e37051a2ad2a9053aa1930021783d962  GFABasic" | sha256sum --check
          test "$(wc -c < GFABasic)" -eq 136548
          printf '\x00\x00\x03\xf3' | cmp -n 4 - GFABasic
          file GFABasic || true

      - name: Download Ghidra
        run: |
          set -euo pipefail
          URL="$(curl --fail --silent --show-error https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest |
            jq -r '.assets[] | select(.name | test("^ghidra_.*PUBLIC.*\\.zip$")) | .browser_download_url' | head -n 1)"
          test -n "$URL"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 "$URL" -o /tmp/ghidra.zip
          mkdir -p /opt/ghidra
          unzip -q /tmp/ghidra.zip -d /opt/ghidra
          echo "GHIDRA_HOME=$(find /opt/ghidra -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Extract printable strings with file offsets
        run: python3 scripts/amiga_binary_strings.py analysis-input/GFABasic analysis-output/strings.json

      - name: Import and analyze Amiga executable with Ghidra
        run: |
          set -euo pipefail
          # Ghidra 12 removed the bundled Jython runtime. Launch headless mode
          # through PyGhidra so the existing CPython exporter is available.
          python3 -m venv /tmp/pyghidra-venv
          /tmp/pyghidra-venv/bin/python -m pip install --no-index \
            --find-links "$GHIDRA_HOME/Ghidra/Features/PyGhidra/pypkg/dist" pyghidra
          mkdir -p /tmp/ghidra-project
          /tmp/pyghidra-venv/bin/python -m pyghidra.ghidra_launch \
            --install-dir "$GHIDRA_HOME" \
            ghidra.app.util.headless.AnalyzeHeadless \
            /tmp/ghidra-project GfaBasic352 \
            -import analysis-input/GFABasic \
            -processor "68000:BE:32:default" \
            -scriptPath scripts/ghidra \
            -postScript ExportGfaAnalysis.py "$GITHUB_WORKSPACE/analysis-output" \
            -deleteProject

      - name: Build analysis index
        run: python3 scripts/build_amiga_analysis_report.py analysis-output

      - name: Validate Ghidra analysis outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("analysis-output")
          required = (
              "REPORT.md", "strings.json", "functions.json",
              "memory_blocks.json", "analysis_stats.json",
              "instructions.jsonl", "references.jsonl", "string_xrefs.jsonl", "unclaimed_instructions.jsonl", "decompiled.c",
          )
          missing = [name for name in required if not (out / name).is_file()]
          if missing:
              raise SystemExit(f"Missing analysis outputs: {', '.join(missing)}")

          stats = json.loads((out / "analysis_stats.json").read_text())
          functions = json.loads((out / "functions.json").read_text())
          blocks = json.loads((out / "memory_blocks.json").read_text())
          if not functions:
              raise SystemExit("Ghidra did not discover any functions; refusing to publish")
          if not stats.get("instructions", 0):
              raise SystemExit("Ghidra exported no instructions; refusing to publish")
          if not any(block.get("execute") and block.get("initialized") for block in blocks):
              raise SystemExit("No initialized executable memory block was imported")
          if (out / "decompiled.c").stat().st_size == 0:
              raise SystemExit("Ghidra decompilation output is empty")
          for filename, key in (("instructions.jsonl", "instructions"),
                                ("references.jsonl", "references")):
              actual = sum(1 for line in (out / filename).open() if line.strip())
              if actual != stats.get(key):
                  raise SystemExit(
                      f"{filename}: expected {stats.get(key)} records, found {actual}"
                  )
          print(
              f"Validated {len(functions)} functions, "
              f"{stats['instructions']} instructions, "
              f"{stats['references']} references"
          )
          PY

      - name: Publish complete analysis to private assets repository (explicit opt-in)
        if: inputs.publish_private_analysis
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: bash scripts/publish_private_amiga_analysis.sh

      - name: Stage explicitly approved public analysis files
        if: inputs.publish_public_analysis
        run: |
          set -euo pipefail
          mkdir -p public-analysis-artifact
          for name in REPORT.md strings.json functions.json memory_blocks.json analysis_stats.json instructions.jsonl references.jsonl string_xrefs.jsonl unclaimed_instructions.jsonl; do
            test -s "analysis-output/$name" || {
              echo "::error::Missing public analysis file: $name"
              exit 1
            }
            cp "analysis-output/$name" public-analysis-artifact/
          done

      - name: Upload reviewed public analysis files only
        if: inputs.publish_public_analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-analysis
          path: public-analysis-artifact/
          if-no-files-found: error
          retention-days: 30


  publish-public-analysis:
    if: github.ref == 'refs/heads/main' && inputs.publish_public_analysis
    needs: prepare-and-analyze
    name: Publish public analysis branch and pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download validated public analysis artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: amiga-gfa-basic-analysis
          path: analysis/amiga-3.52

      - name: Publish reviewed analysis data through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ANALYSIS_BRANCH="amiga-analysis/3.52"
          cat > analysis/amiga-3.52/README.md <<'EOF'
          # GFA BASIC 3.52 Amiga binary analysis

          Generated by the `amiga-reference.yml` workflow from the privately
          held GFA BASIC 3.52 executable. This is reverse-engineering evidence
          for 3.52, not a verified specification for GFA BASIC 3.5.
          Decompiled C files and the original executable are intentionally
          excluded from this public analysis branch.
          EOF

          mkdir -p "$RUNNER_TEMP/published-analysis"
          cp analysis/amiga-3.52/* "$RUNNER_TEMP/published-analysis/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$ANALYSIS_BRANCH" origin/main
          mkdir -p analysis/amiga-3.52
          cp "$RUNNER_TEMP"/published-analysis/* analysis/amiga-3.52/
          git add analysis/amiga-3.52
          if git diff --cached --quiet; then
            echo "Analysis branch already contains the current results."
            exit 0
          fi
          git commit -m "Update generated GFA BASIC 3.52 analysis"
          git push --force origin "$ANALYSIS_BRANCH"
          EXISTING_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$ANALYSIS_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$ANALYSIS_BRANCH" \
              --title "Update generated Amiga GFA BASIC 3.52 analysis" \
              --body "Explicitly approved output from the Amiga GFA-BASIC reference workflow. Binary-derived findings are labelled 3.52 and must not be treated as a verified 3.5 specification."
          else
            echo "Updated existing analysis PR: $EXISTING_PR"
          fi
