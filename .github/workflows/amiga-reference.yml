name: Prepare and analyze Amiga GFA-BASIC reference interpreter

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: amiga-reference-assets
  cancel-in-progress: false

jobs:
  prepare-and-analyze:
    name: Fetch, verify, and analyze GFA BASIC 3.52
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out analysis scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download private interpreter binary
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN" || {
            echo "::error::GFA_ASSETS_TOKEN is not configured."
            exit 1
          }
          mkdir -p dist/amiga/gfa-basic-3.52 analysis-input analysis-output
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/GFABasic?ref=main" \
            --output dist/amiga/gfa-basic-3.52/GFABasic

      - name: Verify binary identity and Amiga executable header
        run: |
          set -euo pipefail
          cd dist/amiga/gfa-basic-3.52
          echo "fd80f6093e8d0163856af5849121e945e37051a2ad2a9053aa1930021783d962  GFABasic" | sha256sum --check
          test "$(wc -c < GFABasic)" -eq 136548
          printf '\x00\x00\x03\xf3' | cmp -n 4 - GFABasic
          file GFABasic || true
          cp GFABasic "$GITHUB_WORKSPACE/analysis-input/GFABasic"

      - name: Package emulator input
        run: |
          set -euo pipefail
          cat > dist/amiga/gfa-basic-3.52/README.txt <<'EOF'
          GFA BASIC 3.52 Amiga interpreter
          Source: private repository vsimko/gfabasic-private-assets, path GFABasic
          SHA-256: fd80f6093e8d0163856af5849121e945e37051a2ad2a9053aa1930021783d962
          Version scope: 3.52 (1990), not the project's normative 3.5 target.
          This package contains the interpreter executable only. A legally usable
          Amiga Kickstart/OS environment and emulator configuration are separate
          prerequisites; this workflow does not bundle ROMs or disk images.
          EOF
          tar -czf "$GITHUB_WORKSPACE/dist/gfa-basic-3.52-amiga.tar.gz" -C dist/amiga gfa-basic-3.52

      - name: Upload verified emulator input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gfa-basic-3.52-amiga
          path: dist/gfa-basic-3.52-amiga.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Install Java and analysis utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes openjdk-21-jdk unzip jq python3
          java -version

      - name: Download Ghidra
        run: |
          set -euo pipefail
          URL="$(curl --fail --silent --show-error https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest |
            jq -r '.assets[] | select(.name | test("^ghidra_.*PUBLIC.*\\.zip$")) | .browser_download_url' | head -n 1)"
          test -n "$URL"
          curl --fail --location --silent --show-error "$URL" -o /tmp/ghidra.zip
          mkdir -p /opt/ghidra
          unzip -q /tmp/ghidra.zip -d /opt/ghidra
          echo "GHIDRA_HOME=$(find /opt/ghidra -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Extract printable strings with file offsets
        run: python3 scripts/amiga_binary_strings.py analysis-input/GFABasic analysis-output/strings.json

      - name: Import and analyze Amiga executable with Ghidra
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghidra-project
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/ghidra-project GfaBasic352 \
            -import analysis-input/GFABasic \
            -processor "68000:BE:32:default" \
            -scriptPath scripts/ghidra \
            -postScript ExportGfaAnalysis.py "$GITHUB_WORKSPACE/analysis-output" \
            -deleteProject

      - name: Build analysis index
        run: python3 scripts/build_amiga_analysis_report.py analysis-output


      - name: Publish reviewed analysis data through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ANALYSIS_BRANCH="amiga-analysis/3.52"
          mkdir -p analysis/amiga-3.52
          cp analysis-output/REPORT.md analysis-output/strings.json \
            analysis-output/functions.json analysis-output/memory_blocks.json \
            analysis-output/analysis_stats.json analysis-output/instructions.jsonl \
            analysis-output/references.jsonl analysis/amiga-3.52/
          cat > analysis/amiga-3.52/README.md <<'EOF'
          # GFA BASIC 3.52 Amiga binary analysis

          Generated by the `amiga-reference.yml` workflow from the privately
          held GFA BASIC 3.52 executable. This is reverse-engineering evidence
          for 3.52, not a verified specification for GFA BASIC 3.5.
          Decompiled C files and the original executable are intentionally
          excluded from this public analysis branch.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$ANALYSIS_BRANCH" || true
          if git ls-remote --exit-code --heads origin "$ANALYSIS_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$ANALYSIS_BRANCH" "origin/$ANALYSIS_BRANCH"
            rm -rf analysis/amiga-3.52
          else
            git checkout --orphan "$ANALYSIS_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p analysis/amiga-3.52
          cp "$GITHUB_WORKSPACE"/analysis/amiga-3.52/* analysis/amiga-3.52/
          git add analysis/amiga-3.52
          if git diff --cached --quiet; then
            echo "Analysis branch already contains the current results."
            exit 0
          fi
          git commit -m "Update generated GFA BASIC 3.52 analysis"
          git push --force origin "$ANALYSIS_BRANCH"
          EXISTING_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$ANALYSIS_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$ANALYSIS_BRANCH" \
              --title "Update generated Amiga GFA BASIC 3.52 analysis" \
              --body "Automated output from the Amiga GFA-BASIC reference workflow. Binary-derived findings are labelled 3.52 and must not be treated as a verified 3.5 specification."
          else
            echo "Updated existing analysis PR: $EXISTING_PR"
          fi

      - name: Upload reverse-engineering results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amiga-gfa-basic-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 30
