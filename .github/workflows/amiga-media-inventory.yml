name: Inventory private Amiga GFA BASIC media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-private-media:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Amiga inventory apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-ubuntu-24.04-amiga-inventory-apt-${{ hashFiles('.github/workflows/amiga-media-inventory.yml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-amiga-inventory-apt-

      - name: Cache Python wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-amiga-inventory-pip-${{ hashFiles('.github/workflows/amiga-media-inventory.yml') }}
          restore-keys: |
            ${{ runner.os }}-python-amiga-inventory-pip-

      - name: Prepare dependency cache directories
        run: mkdir -p "$RUNNER_TEMP/apt-archives/partial" "$HOME/.cache/pip"

      - name: Download and inventory private ZIP archives
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p media/{archives,extracted} artifacts/amiga-media-inventory
          cat > "$RUNNER_TEMP/media.tsv" <<'EOF'
          3.5|GFA Basic Editor 3.5.zip
          3.041|GFA-BASIC v3.041 (1989-08-31)(GFA Systemtechnik).zip
          3.52-disk1|GFA-BASIC v3.52 (1990)(GFA Systemtechnik)(DE)(Disk 1 of 2)[WB].zip
          3.52-disk2|GFA-BASIC v3.52 (1990)(GFA Systemtechnik)(DE)(Disk 2 of 2).zip
          EOF

          python scripts/check_private_github_assets.py --repo vsimko/gfabasic-private-assets --ref main --manifest "$RUNNER_TEMP/media.tsv"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives/" unzip file
          python3 -m pip install --cache-dir "$HOME/.cache/pip" --break-system-packages amitools

          while IFS='|' read -r label filename; do
            python3 - "$filename" "media/archives/$label.zip" <<'PY'
          import os
          import shutil
          import sys
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          filename, destination = sys.argv[1:]
          url = f"https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/{quote(filename, safe='')}?ref=main"
          request = Request(url, headers={
              "Authorization": f"Bearer {os.environ['GFA_ASSETS_TOKEN']}",
              "Accept": "application/vnd.github.raw",
          })
          with urlopen(request, timeout=60) as response, open(destination, "wb") as output:
              shutil.copyfileobj(response, output)
          PY
            printf '%s\t%s\t' "$label" "$filename" >> artifacts/amiga-media-inventory/archive-sha256.txt
            sha256sum "media/archives/$label.zip" | cut -d' ' -f1 >> artifacts/amiga-media-inventory/archive-sha256.txt
            mkdir -p "media/extracted/$label"
            unzip -q "media/archives/$label.zip" -d "media/extracted/$label"
            ADF_COUNT="$(find "media/extracted/$label" -type f -iname '*.adf' | wc -l)"
            test "$ADF_COUNT" -eq 1 || {
              echo "Expected exactly one ADF in $filename; found $ADF_COUNT"
              find "media/extracted/$label" -type f -printf '%P\n'
              exit 1
            }
            {
              echo "## $label — $filename"
              echo
              echo '### ZIP entries'
              unzip -Z1 "media/archives/$label.zip"
              echo
              echo '### Extracted files'
              find "media/extracted/$label" -type f -printf '%P\t%s bytes\n' | sort
              echo
              echo '### File identification'
              find "media/extracted/$label" -type f -print0 | xargs -0 -r file
              echo
            } >> artifacts/amiga-media-inventory/archive-contents.txt
          done < "$RUNNER_TEMP/media.tsv"

      - name: Inspect ADF filesystem contents
        run: |
          set -euo pipefail
          {
            while IFS= read -r -d '' image; do
              echo "===== ADF metadata ====="
              printf 'Path: %s\\n' "$image"
              stat -c 'Size: %s bytes' "$image"
              sha256sum "$image"
              file "$image"
              echo "--- filesystem entry names ---"
              xdftool "$image" list / all
              echo
            done < <(find media/extracted -type f -iname '*.adf' -print0 | sort -z)
          } > artifacts/amiga-media-inventory/adf-filesystems.txt

          if ! find media/extracted -type f -iname '*.adf' -print -quit | grep -q .; then
            echo "No .adf files found in the uploaded ZIP archives." | tee artifacts/amiga-media-inventory/adf-filesystems.txt
          fi

      - name: Extract and fingerprint interpreter and compiler candidates
        run: |
          set -euo pipefail
          mkdir -p artifacts/amiga-media-inventory/executable-fingerprints
          ADF_35="$(find media/extracted/3.5 -type f -iname '*.adf' -print -quit)"
          ADF_3041="$(find media/extracted/3.041 -type f -iname '*.adf' -print -quit)"
          ADF_352_1="$(find media/extracted/3.52-disk1 -type f -iname '*.adf' -print -quit)"
          ADF_352_2="$(find media/extracted/3.52-disk2 -type f -iname '*.adf' -print -quit)"
          for image in "$ADF_35" "$ADF_3041" "$ADF_352_1" "$ADF_352_2"; do
            test -n "$image" || { echo "Expected one ADF for every configured media label"; exit 1; }
          done

          extract_and_report() {
            local label="$1" image="$2" amiga_path="$3"
            local output="$RUNNER_TEMP/gfa-candidates/$label"
            mkdir -p "$output"
            xdftool "$image" read "$amiga_path" "$output/$label"
            {
              echo "Candidate: $label"
              echo "ADF: $image"
              echo "Amiga path: $amiga_path"
              wc -c "$output/$label"
              sha256sum "$output/$label"
              file "$output/$label"
              printf 'Header bytes: '
              od -An -tx1 -N4 "$output/$label"
              echo
            } >> artifacts/amiga-media-inventory/executable-fingerprints/REPORT.txt
          }

          extract_and_report "gfabasic-3.5" "$ADF_35" "gfabasic"
          extract_and_report "gfabasic-3.041" "$ADF_3041" "gfabasic"
          extract_and_report "gfabasro-3.041" "$ADF_3041" "gfabasro"
          extract_and_report "gfabasic-3.52" "$ADF_352_1" "GFABasic"
          extract_and_report "gfabasro-3.52" "$ADF_352_1" "GFABasRo"
          extract_and_report "gfa-bcom-3.52" "$ADF_352_2" "GFA_BCOM"

          # Binary and documentation contents stay out of the public inventory artifact.

      - name: Publish metadata-only inventory artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-media-inventory
          path: artifacts/amiga-media-inventory/
          if-no-files-found: error
          retention-days: 14

