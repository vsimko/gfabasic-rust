name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "api/**"
      - "scripts/**"
      - "validation/**"
      - "tests/tooling/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate project data
        run: |
          if [ -f scripts/generate_project_data.py ]; then
            python3 scripts/generate_project_data.py
          fi
          python3 scripts/generate_api_catalogue.py
          GH_TOKEN="${{ github.token }}" python3 scripts/generate_ci_health.py

      - name: Validate repository consistency
        run: |
          if [ -f scripts/validate_repository.py ]; then
            python3 scripts/validate_repository.py
            python3 -m unittest discover -s tests/tooling
          fi

      - name: Validate static site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/script.js
          test -s site/data/api-catalogue.json
          test -s site/data/ci-health.json
          grep -q 'id="ci-health"' site/index.html
          test -d site/data/api-catalogue-details
          python3 scripts/generate_api_catalogue.py --check
          node --check site/script.js
          grep -q 'name="description"' site/index.html
          grep -q 'id="main-nav"' site/index.html
          grep -q 'id="api-catalogue"' site/index.html

      - name: Publish production site while preserving active previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          staging_dir="$(mktemp -d)"
          cp -a site/. "$staging_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -f -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rsync -a --delete --exclude='.git/' --exclude='pr-preview/' "$staging_dir/" ./
          rm -rf "$staging_dir"
          git add -f -A
          if git diff --cached --quiet; then
            echo "Production site is already up to date."
            exit 0
          fi
          git commit -m "Deploy production site from ${GITHUB_SHA}"
          git push origin gh-pages
