name: Pull request website preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Do not run write-enabled preview deployment for untrusted fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build website
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/generate_project_data.py ]; then
            python3 scripts/generate_project_data.py
          fi
          python3 scripts/generate_api_catalogue.py
          python3 scripts/generate_ci_health.py
          if [ -f scripts/validate_repository.py ]; then
            python3 scripts/validate_repository.py
            python3 -m unittest discover -s tests/tooling
          fi
          test -s site/index.html
          test -s site/styles.css
          test -s site/script.js
          test -s site/data/api-catalogue.json
          test -s site/data/ci-health.json
          grep -q 'id="ci-health"' site/index.html
          test -d site/data/api-catalogue-details
          python3 scripts/generate_api_catalogue.py --check
          node --check site/script.js
          grep -q 'id="api-catalogue"' site/index.html

      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976
        with:
          source-dir: site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
          comment: true
          qr-code: false

      - name: Smoke-test deployed preview HTML
        if: github.event.action != 'closed'
        run: |
          PREVIEW_URL="https://vsimko.github.io/gfabasic-rust/pr-preview/pr-${{ github.event.pull_request.number }}/" python3 scripts/tests/test_deployed_preview.py
