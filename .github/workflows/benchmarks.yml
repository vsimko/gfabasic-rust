name: Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - ".github/workflows/security-audit.yml"
      - "bench/**"
      - "crates/gfabasic-compiler/src/source.rs"
      - "docs/architecture/BENCHMARKING.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmarks.yml"
      - "bench/**"
      - "crates/gfabasic-compiler/src/source.rs"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-benchmark:
    if: github.event_name == 'pull_request'
    name: Validate benchmark workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1

      - name: Check benchmark formatting
        run: cargo +1.99.1 fmt --manifest-path bench/Cargo.toml -- --check

      - name: Compile benchmark without running measurements
        run: cargo +1.99.1 check --manifest-path bench/Cargo.toml --target-dir bench/target --benches --locked

  benchmark:
    if: github.event_name != 'pull_request'
    name: Source-loading benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Identify benchmark host for a comparable baseline
        id: host
        run: |
          cpu_model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed 's/[^A-Za-z0-9._-]/_/g')"
          echo "cpu_model=$cpu_model" >> "$GITHUB_OUTPUT"
          echo "kernel=$(uname -r)" >> "$GITHUB_OUTPUT"

      - name: Restore same-host Criterion baseline
        id: criterion-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: bench/target/criterion
          key: criterion-source-loading-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.cpu_model }}-${{ steps.host.outputs.kernel }}-rust-1.99.1-${{ hashFiles('bench/Cargo.lock') }}-workload-v1

      - name: Run source-loading benchmarks
        run: cargo +1.99.1 bench --manifest-path bench/Cargo.toml --target-dir bench/target --bench source_loading --locked -- --noplot

      - name: Record benchmark environment
        env:
          CPU_MODEL: ${{ steps.host.outputs.cpu_model }}
          KERNEL_RELEASE: ${{ steps.host.outputs.kernel }}
          CRITERION_CACHE_HIT: ${{ steps.criterion-cache.outputs.cache-hit == 'true' }}
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'benchmark=source_loading/in_memory_utf8\n'
            printf 'workload=synthetic-source-loader-v1\n'
            printf 'benchmark-lock-sha256=%s\n' "$(sha256sum bench/Cargo.lock | cut -d' ' -f1)"
            printf 'target=x86_64-unknown-linux-gnu\n'
            printf 'runner=ubuntu-24.04\n'
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'kernel-release=%s\n' "$KERNEL_RELEASE"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'logical-cpus=%s\n' "$(nproc)"
            printf 'cpu-model=%s\n' "$CPU_MODEL"
            printf 'criterion-cache-hit=%s\n' "$CRITERION_CACHE_HIT"
            printf 'memory-total-kib=%s\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          } > "$RUNNER_TEMP/benchmark-metadata.txt"
          rustc +1.99.1 --version --verbose > "$RUNNER_TEMP/rustc-version.txt"

      - name: Upload Criterion reports and environment metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-loading-benchmark-${{ github.run_id }}
          path: |
            bench/target/criterion/
            ${{ runner.temp }}/benchmark-metadata.txt
            ${{ runner.temp }}/rustc-version.txt
          if-no-files-found: error
          retention-days: 30
