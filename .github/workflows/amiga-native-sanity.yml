name: Amiga native workflow scheduler sanity

on:
  push:
    paths:
      - ".github/workflows/amiga-native-sanity.yml"
  pull_request:
    paths:
      - ".github/workflows/amiga-native-sanity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Verify Actions can plan a native probe job
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow job was scheduled
        run: echo "AMIGA_NATIVE_WORKFLOW_JOB_SCHEDULED=yes"
