name: Amiga GFA-BASIC reference version matrix

on:
  push:
    branches:
      - main
      - "experiment/**"
    paths:
      - ".github/workflows/amiga-reference-matrix.yml"
      - ".github/workflows/amiga-native-merge-run.yml"
      - ".github/workflows/amiga-3041u-native-merge-run.yml"
      - "tests/interpreter-probes/amiga-3.52/**"
      - "tests/interpreter-probes/amiga-3.041u/**"
      - "tests/interpreter-probes/amiga-3.5/**"
      - "scripts/amiga-cli-probe-35.sh"
      - "scripts/amiga-cli-probe-3041u.sh"
      - "scripts/validate_gfatest_results.py"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tests/interpreter-probes/amiga-3.52/**"
      - "tests/interpreter-probes/amiga-3.041u/**"
      - "tests/interpreter-probes/amiga-3.5/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Single version for a construct matrix child run; empty runs the full reference matrix."
        required: false
        type: string
        default: ""
      construct_id:
        description: "Construct ID for an isolated probe."
        required: false
        type: string
        default: ""
      probe_path:
        description: "Repository-relative .LST probe path."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: amiga-reference-matrix-${{ github.event.pull_request.number || github.ref }}-${{ inputs.construct_id || 'baseline' }}-${{ inputs.version || 'all' }}
  cancel-in-progress: true

jobs:
  amiga-352:
    if: (!inputs.version || inputs.version == '3.52') && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) && (github.event_name != 'push' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/experiment/')) && github.actor == github.repository_owner)) && (github.event_name != 'pull_request' || github.event.pull_request.author_association == 'OWNER')
    name: GFA-BASIC 3.52 native run
    uses: ./.github/workflows/amiga-native-merge-run.yml
    with:
      construct_id: ${{ inputs.construct_id }}
      probe_path: ${{ inputs.probe_path }}
    secrets: inherit

  amiga-3041u:
    if: (!inputs.version || inputs.version == '3.041U') && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) && (github.event_name != 'push' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) && (github.event_name != 'pull_request' || github.event.pull_request.author_association == 'OWNER')
    name: GFA-BASIC 3.041U native run
    uses: ./.github/workflows/amiga-3041u-native-merge-run.yml
    with:
      construct_id: ${{ inputs.construct_id }}
      probe_path: ${{ inputs.probe_path }}
    secrets: inherit

  amiga-35:
    if: (!inputs.version || inputs.version == '3.5') && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) && (github.event_name != 'push' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) && (github.event_name != 'pull_request' || github.event.pull_request.author_association == 'OWNER')
    name: GFA-BASIC 3.5 native Merge + Run probes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: ${{ inputs.construct_id != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Amiga CI apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-ubuntu-24.04-amiga-apt-amiberry-ocr-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-amiga-apt-

      - name: Cache Python wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-amiga-amitools-v1
          restore-keys: |
            ${{ runner.os }}-python-3.12-amiga-

      - name: Prepare dependency cache directories
        run: mkdir -p "$RUNNER_TEMP/apt-archives/partial" "$HOME/.cache/pip"


      - name: Download candidate 3.5 editor disk archive
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p artifacts/amiga-3.5-discovery
          ARCHIVE_NAME='GFA Basic Editor 3.5.zip'
          ARCHIVE_PATH_ENCODED="$(jq -rn --arg path "$ARCHIVE_NAME" '$path | @uri')"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ARCHIVE_PATH_ENCODED?ref=main" \
            --output "$RUNNER_TEMP/gfa-basic-3.5.zip"
          printf 'archive_size=%s\\n' "$(wc -c < "$RUNNER_TEMP/gfa-basic-3.5.zip")" > artifacts/amiga-3.5-discovery/archive-info.txt
          unzip -Z1 "$RUNNER_TEMP/gfa-basic-3.5.zip" | tee artifacts/amiga-3.5-discovery/archive-members.txt
          mapfile -t ADF_MEMBERS < <(unzip -Z1 "$RUNNER_TEMP/gfa-basic-3.5.zip" | grep -i '\.adf$' || true)
          test "${#ADF_MEMBERS[@]}" -eq 1 || { echo "Expected exactly one ADF candidate, found ${#ADF_MEMBERS[@]}"; exit 1; }
          python3 - "$RUNNER_TEMP/gfa-basic-3.5.zip" "${ADF_MEMBERS[0]}" "$RUNNER_TEMP/gfa-basic-3.5.adf" <<'PY'
          import shutil, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              with archive.open(sys.argv[2]) as source, open(sys.argv[3], "wb") as target:
                  shutil.copyfileobj(source, target)
          PY
          python3 -m pip install --cache-dir "$HOME/.cache/pip" --break-system-packages amitools
          xdftool "$RUNNER_TEMP/gfa-basic-3.5.adf" info | tee artifacts/amiga-3.5-discovery/adf-info.txt
          xdftool "$RUNNER_TEMP/gfa-basic-3.5.adf" list / all | tee artifacts/amiga-3.5-discovery/adf-files.txt
          xdftool "$RUNNER_TEMP/gfa-basic-3.5.adf" read gfabasic "$RUNNER_TEMP/gfabasic-3.5"
          sha256sum "$RUNNER_TEMP/gfabasic-3.5" > artifacts/amiga-3.5-discovery/interpreter-sha256.txt
          wc -c < "$RUNNER_TEMP/gfabasic-3.5" > artifacts/amiga-3.5-discovery/interpreter-size.txt
          file "$RUNNER_TEMP/gfabasic-3.5" > artifacts/amiga-3.5-discovery/interpreter-file.txt
          strings -a "$RUNNER_TEMP/gfabasic-3.5" | grep -i -E 'GFA.BASIC|VERSION|3[.]5|3[.]52' | head -80 > artifacts/amiga-3.5-discovery/interpreter-strings.txt || true
          sha256sum "$RUNNER_TEMP/gfa-basic-3.5.adf" > artifacts/amiga-3.5-discovery/adf-sha256.txt
          wc -c < "$RUNNER_TEMP/gfa-basic-3.5.adf" > artifacts/amiga-3.5-discovery/adf-size.txt
          printf '%s\\n' "${ADF_MEMBERS[0]}" > artifacts/amiga-3.5-discovery/adf-member.txt
          echo "Candidate disk discovered; running editor identity will be verified from the held-right-button menu screenshot. Native language conformance remains UNTESTED." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture the running editor version from its right-button menu
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          BOOT_VOLUME="$RUNNER_TEMP/gfa-basic-3.5-boot-volume"
          mkdir -p "$BOOT_VOLUME/S"
          cp "$RUNNER_TEMP/gfabasic-3.5" "$BOOT_VOLUME/gfabasic"
          printf 'gfabasic\n' > "$BOOT_VOLUME/S/Startup-Sequence"
          xdftool "$RUNNER_TEMP/gfa-basic-3.5-boot.adf" create + format GFA35 ofs + write "$BOOT_VOLUME/gfabasic" + write "$BOOT_VOLUME/S"
          # Never place the commercial interpreter executable in an artifact tree.
          rm -rf "$BOOT_VOLUME"
          xdftool "$RUNNER_TEMP/gfa-basic-3.5-boot.adf" boot install boot1x
          xdftool "$RUNNER_TEMP/gfa-basic-3.5-boot.adf" info > artifacts/amiga-3.5-discovery/boot-adf-info.txt

          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd tesseract-ocr python3-pil

          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents?ref=main" \
            --output "$RUNNER_TEMP/private-assets-index.json"
          ROM_NAME="$(jq -r '[.[] | select(.type == "file" and .size == 524288 and (.name|test("(?i)kickstart.*v?1[.]3.*34[.]5"))) ] | .[0].name // empty' "$RUNNER_TEMP/private-assets-index.json")"
          test -n "$ROM_NAME" || { echo "No 512 KiB Kickstart 1.3 rev 34.5 ROM found"; exit 1; }
          ROM_PATH_ENCODED="$(jq -rn --arg path "$ROM_NAME" '$path | @uri')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ROM_PATH_ENCODED?ref=main" \
            --output "$RUNNER_TEMP/kick.rom"
          test "$(wc -c < "$RUNNER_TEMP/kick.rom")" -eq 524288
          sha256sum "$RUNNER_TEMP/kick.rom" > artifacts/amiga-3.5-discovery/kickstart-sha256.txt

          cat > "$RUNNER_TEMP/amiga-3.5.uae" <<EOF
          use_gui=no
          cpu_type=68000
          chipset=ocs
          kickstart_rom_file=$RUNNER_TEMP/kick.rom
          chipmem_size=2
          fastmem_size=8
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          floppy0=$RUNNER_TEMP/gfa-basic-3.5-boot.adf
          EOF

          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-3.5-discovery/amiberry.log"
          export SDL_AUDIODRIVER=dummy
          env -u SHELLOPTS xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -c '
            set +u
            set -eo pipefail
            amiberry -G -f "$RUNNER_TEMP/amiga-3.5.uae" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() { kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            ipc_socket_path=""
            for attempt in $(seq 1 45); do
              ipc_socket_path="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$ipc_socket_path" ]; then break; fi
              sleep 1
            done
            test -n "$ipc_socket_path" || { cat "$AMIBERRY_LOG"; exit 1; }
            sleep 35
            # Amiberry IPC button mask: bit 0 = left, bit 1 = right, bit 2 = middle.
            # Take the screenshot immediately while the right button remains down.
            printf "SEND_MOUSE\t0\t0\t2\n" | timeout 5s nc -U -N "$ipc_socket_path"
            sleep 0.1
            printf "SCREENSHOT\t%s\n" "$GITHUB_WORKSPACE/artifacts/amiga-3.5-discovery/editor-version-menu.png" | timeout 5s nc -U -N "$ipc_socket_path"
            printf "SEND_MOUSE\t0\t0\t0\n" | timeout 5s nc -U -N "$ipc_socket_path"
            sleep 0.2
            printf "SCREENSHOT\t%s\n" "$GITHUB_WORKSPACE/artifacts/amiga-3.5-discovery/editor-after-menu.png" | timeout 5s nc -U -N "$ipc_socket_path"
            printf "QUIT\n" | timeout 5s nc -U -N "$ipc_socket_path" || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
              sleep 1
            done
          '
          test -s artifacts/amiga-3.5-discovery/editor-version-menu.png
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          image = Image.open("artifacts/amiga-3.5-discovery/editor-version-menu.png").convert("L")
          image = ImageOps.invert(image).resize((image.width * 3, image.height * 3))
          ImageEnhance.Contrast(image).enhance(3).save("artifacts/amiga-3.5-discovery/editor-version-menu-ocr.png")
          PY
          tesseract artifacts/amiga-3.5-discovery/editor-version-menu-ocr.png stdout --psm 6 2>/dev/null | tee artifacts/amiga-3.5-discovery/editor-version-menu-ocr.txt
          if grep -Eiq 'GFA[ -]?BASIC.*3[.]5([^0-9U]|$)' artifacts/amiga-3.5-discovery/editor-version-menu-ocr.txt; then
            echo "EDITOR_MENU_OCR=GFA BASIC 3.5" > artifacts/amiga-3.5-discovery/editor-version-result.txt
          else
            echo "EDITOR_MENU_OCR=INCONCLUSIVE; inspect editor-version-menu.png" > artifacts/amiga-3.5-discovery/editor-version-result.txt
          fi
          echo "The right-button menu screenshot is the authoritative version evidence; OCR is diagnostic only. The screenshot is retained for visual verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare writable 3.5 test disk
        env:
          GFA_CONSTRUCT_ID_INPUT: ${{ inputs.construct_id }}
          GFA_PROBE_PATH_INPUT: ${{ inputs.probe_path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/amiga-3.5-discovery/native-run
          TEST_ADF="$RUNNER_TEMP/gfatest.adf"
          xdftool "$TEST_ADF" create
          xdftool "$TEST_ADF" format GFATEST ofs
          xdftool "$TEST_ADF" makedir S
          printf 'DF1:gfabasic\n' > "$RUNNER_TEMP/Startup-Sequence"
          xdftool "$TEST_ADF" write "$RUNNER_TEMP/Startup-Sequence" S/Startup-Sequence
          if [ -n "$GFA_PROBE_PATH_INPUT" ]; then
            test -n "$GFA_CONSTRUCT_ID_INPUT"
            test -f "$GFA_PROBE_PATH_INPUT"
            xdftool "$TEST_ADF" write "$GFA_PROBE_PATH_INPUT" gfatest.LST
            printf '%s\n' "$GFA_CONSTRUCT_ID_INPUT" > "$RUNNER_TEMP/expected-ids.txt"
            echo "GFATEST_EXPECTED_IDS_FILE=$RUNNER_TEMP/expected-ids.txt" >> "$GITHUB_ENV"
            echo "GFA_CONSTRUCT_ID=$GFA_CONSTRUCT_ID_INPUT" >> "$GITHUB_ENV"
          else
            xdftool "$TEST_ADF" write tests/interpreter-probes/amiga-3.5/regression-suite.LST gfatest.LST
            echo "GFATEST_EXPECTED_IDS_FILE=tests/interpreter-probes/amiga-3.5/expected-ids.txt" >> "$GITHUB_ENV"
            echo "GFA_CONSTRUCT_ID=" >> "$GITHUB_ENV"
          fi
          xdftool "$TEST_ADF" boot install boot1x
          xdftool "$TEST_ADF" list / all > artifacts/amiga-3.5-discovery/native-run/test-disk-layout.txt
          xdftool "$TEST_ADF" boot show > artifacts/amiga-3.5-discovery/native-run/test-disk-boot.txt
          grep -F 'bootable: True' artifacts/amiga-3.5-discovery/native-run/test-disk-boot.txt
          if [ -n "$GFA_PROBE_PATH_INPUT" ]; then cp "$GFA_PROBE_PATH_INPUT" artifacts/amiga-3.5-discovery/native-run/gfatest.LST; else cp tests/interpreter-probes/amiga-3.5/regression-suite.LST artifacts/amiga-3.5-discovery/native-run/gfatest.LST; fi

      - name: Merge and run the 3.5 BASIC probe
        id: native-run
        run: bash scripts/amiga-cli-probe-35.sh

      - name: Write per-construct result record
        if: always() && inputs.construct_id != ''
        env:
          CONSTRUCT_ID: ${{ inputs.construct_id }}
          VERSION: "3.5"
          PROBE_PATH: ${{ inputs.probe_path }}
          HARNESS_OUTCOME: ${{ steps.native-run.outcome }}
          RESULT_FILE: artifacts/amiga-3.5-discovery/native-run/gfatest-results.txt
          IDENTITY_SCREENSHOT: artifacts/amiga-3.5-discovery/editor-version-menu.png
          IDENTITY_OCR: artifacts/amiga-3.5-discovery/editor-version-menu-ocr.txt
          OUTPUT_FILE: artifacts/amiga-3.5-discovery/native-run/result.json
        run: |
          EXPECTED_IDS_FILE="${GFATEST_EXPECTED_IDS_FILE:-tests/interpreter-probes/amiga-3.5/expected-ids.txt}"
          python3 scripts/write_construct_result.py \
            --construct-id "$CONSTRUCT_ID" --version "$VERSION" --probe "$PROBE_PATH" \
            --harness-outcome "${HARNESS_OUTCOME:-failure}" --expected-ids "$EXPECTED_IDS_FILE" \
            --results "$RESULT_FILE" --identity-screenshot "$IDENTITY_SCREENSHOT" \
            --identity-ocr "$IDENTITY_OCR" --output "$OUTPUT_FILE"

      - name: Upload non-binary discovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.construct_id != '' && format('amiga-construct-{0}-3.5', inputs.construct_id) || 'amiga-gfa-basic-3.5-asset-discovery' }}
          path: |
            artifacts/amiga-3.5-discovery/
            !artifacts/amiga-3.5-discovery/boot-volume/gfabasic
            !artifacts/amiga-3.5-discovery/**/*.adf
            !artifacts/amiga-3.5-discovery/**/*.rom
            !artifacts/amiga-3.5-discovery/**/gfabasic
          if-no-files-found: warn
          retention-days: 7

  matrix-summary:
    name: Reference matrix summary
    if: always()
    needs: [amiga-352, amiga-3041u, amiga-35]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish per-version status
        env:
          STATUS_352: ${{ needs.amiga-352.result }}
          STATUS_3041U: ${{ needs.amiga-3041u.result }}
          STATUS_35: ${{ needs.amiga-35.result }}
          SELECTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          TRUSTED_EVENT=true
          if [ "$EVENT_NAME" = "pull_request" ] && { [ "$HEAD_REPOSITORY" != "$REPOSITORY" ] || [ "$PR_AUTHOR_ASSOCIATION" != "OWNER" ]; }; then
            TRUSTED_EVENT=false
          elif [ "$EVENT_NAME" != "pull_request" ] && { ( [ "$REF" != "refs/heads/main" ] && [[ "$REF" != refs/heads/experiment/* ]] ) || [ "$ACTOR" != "$REPOSITORY_OWNER" ]; }; then
            TRUSTED_EVENT=false
          fi
          {
            echo "## Amiga GFA-BASIC reference matrix"
            echo ""
            echo "| Interpreter | Native workflow result | Selection |"
            echo "|---|---|---|"
            if [ -z "$SELECTED_VERSION" ] || [ "$SELECTED_VERSION" = "3.52" ]; then echo "| 3.52 | $STATUS_352 | selected |"; else echo "| 3.52 | $STATUS_352 | not selected |"; fi
            if [ -z "$SELECTED_VERSION" ] || [ "$SELECTED_VERSION" = "3.041U" ]; then echo "| 3.041U | $STATUS_3041U | selected |"; else echo "| 3.041U | $STATUS_3041U | not selected |"; fi
            if [ -z "$SELECTED_VERSION" ] || [ "$SELECTED_VERSION" = "3.5" ]; then echo "| 3.5 | $STATUS_35 | selected |"; else echo "| 3.5 | $STATUS_35 | not selected |"; fi
            echo ""
            echo "A green workflow means the selected native harness and its host-side result protocol completed. Per-construct GFATEST outcomes are retained in the construct-result artifact; the 3.5 profile remains a smoke profile, not complete language conformance."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SELECTED_VERSION" ]; then
            if [ "$STATUS_352" = failure ] || [ "$STATUS_3041U" = failure ] || [ "$STATUS_35" = failure ]; then
              echo "::error::At least one configured baseline matrix job failed."
              exit 1
            fi
            if [ "$STATUS_352" != success ] || [ "$STATUS_3041U" != success ] || [ "$STATUS_35" != success ]; then
              if [ "$TRUSTED_EVENT" = false ]; then
                echo "Native matrix: UNTESTED (private assets withheld for this event)." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::A trusted baseline native matrix job was skipped or did not complete."
                exit 1
              fi
            fi
          else
            case "$SELECTED_VERSION" in
              3.52) SELECTED_STATUS="$STATUS_352" ;;
              3.041U) SELECTED_STATUS="$STATUS_3041U" ;;
              3.5) SELECTED_STATUS="$STATUS_35" ;;
              *) echo "::error::Unsupported selected version: $SELECTED_VERSION"; exit 1 ;;
            esac
            if [ "$SELECTED_STATUS" = failure ]; then
              echo "::error::Selected native workflow $SELECTED_VERSION failed."
              exit 1
            elif [ "$SELECTED_STATUS" != success ]; then
              if [ "$TRUSTED_EVENT" = false ]; then
                echo "Native matrix $SELECTED_VERSION: UNTESTED (private assets withheld for this event)." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::Selected native workflow $SELECTED_VERSION was skipped or did not complete."
                exit 1
              fi
            fi
          fi
