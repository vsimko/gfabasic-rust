name: Rust mutation testing

on:
  # Fixed UTC schedule: 02:00 UTC daily (03:00 CET / 04:00 CEST).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-mutation-main
  cancel-in-progress: false

jobs:
  mutants:
    name: Rust source-map mutation tests
    # Manual runs are always enabled; scheduled runs must match the exact configured cron payload.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rustup-1.99.1-minimal-mutation

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutation-1.99.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutation-1.99.1-

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Install pinned cargo-mutants
        run: cargo +1.99.1 install cargo-mutants --version 27.1.0 --locked

      - name: Run bounded Rust-only mutation testing
        run: >-
          cargo mutants
          --package gfabasic-compiler
          --file crates/gfabasic-compiler/src/source.rs
          --jobs 2
          --timeout 120
          --output mutants.out
          --caught
          --unviable

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-mutation-results-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14
