name: Amiga GFA BASIC 3.041U native Merge and Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/amiga-3041u-native-merge-run.yml"
      - "tests/interpreter-probes/amiga-3.041u/**"
      - "scripts/amiga-cli-probe-3041u.sh"
      - "scripts/validate_gfatest_results.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      construct_id:
        description: "Construct ID for an isolated probe; empty runs the full baseline suite."
        required: false
        type: string
        default: ""
      probe_path:
        description: "Repository-relative .LST probe path for the selected construct."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  cli-probe:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.author_association == 'OWNER')) && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) && (github.event_name != 'push' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: ${{ inputs.construct_id != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Amiga CI apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-ubuntu-24.04-amiga-apt-${{ hashFiles('.github/workflows/amiga-reference-matrix.yml', '.github/workflows/amiga-native-merge-run.yml', '.github/workflows/amiga-3041u-native-merge-run.yml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-amiga-apt-

      - name: Cache Python wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-amiga-pip-v1
          restore-keys: |
            ${{ runner.os }}-python-amiga-pip-

      - name: Prepare dependency cache directories
        run: mkdir -p "$RUNNER_TEMP/apt-archives/partial" "$HOME/.cache/pip"


      - name: Download and extract private GFA BASIC 3.041U interpreter
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p amiga-volume/S artifacts/amiga-cli-probe
          python3 -m pip install --cache-dir "$HOME/.cache/pip" --break-system-packages amitools
          ZIP_NAME='GFA-BASIC v3.041 (1989-08-31)(GFA Systemtechnik).zip'
          ZIP_PATH_ENCODED="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ZIP_NAME")"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ZIP_PATH_ENCODED?ref=main" \
            --output "$RUNNER_TEMP/gfa-basic-3.041u.zip"
          mapfile -t ADF_ENTRIES < <(unzip -Z1 "$RUNNER_TEMP/gfa-basic-3.041u.zip" | grep -i -E '\.adf$' || true)
          test "${#ADF_ENTRIES[@]}" -eq 1 || { echo "Expected exactly one ADF in the private ZIP, found ${#ADF_ENTRIES[@]}"; unzip -Z1 "$RUNNER_TEMP/gfa-basic-3.041u.zip"; exit 1; }
          ADF_ENTRY="${ADF_ENTRIES[0]}"
          printf '%s\n' "$ADF_ENTRY" | tee artifacts/amiga-cli-probe/source-adf-entry.txt
          python3 - "$RUNNER_TEMP/gfa-basic-3.041u.zip" "$ADF_ENTRY" "$RUNNER_TEMP/gfa-basic-3.041u.adf" <<'PY'
          import shutil
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              with archive.open(sys.argv[2]) as source, open(sys.argv[3], "wb") as target:
                  shutil.copyfileobj(source, target)
          PY
          xdftool "$RUNNER_TEMP/gfa-basic-3.041u.adf" read gfabasic amiga-volume/gfabasic
          echo "f5185db2dfc99af11a15570120f0c40df9f8ad201c28b43cc0894bfaa9562759  amiga-volume/gfabasic" | sha256sum --check
          test "$(wc -c < amiga-volume/gfabasic)" -eq 125092
          printf '\x00\x00\x03\xf3' | cmp -n 4 - amiga-volume/gfabasic
          file amiga-volume/gfabasic | tee artifacts/amiga-cli-probe/binary-info.txt
          strings -a amiga-volume/gfabasic | grep -i -E 'GFA.BASIC|Version 3.041 U|MERGE|SAVE|LIST' | head -80 > artifacts/amiga-cli-probe/binary-strings.txt || true
          sha256sum "$RUNNER_TEMP/gfa-basic-3.041u.adf" > artifacts/amiga-cli-probe/source-adf-sha256.txt

      - name: Download original Amiga Kickstart ROM
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p private-kickstart artifacts/amiga-cli-probe
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents?ref=main" \
            --output "$RUNNER_TEMP/private-assets-index.json"
          jq -r '.[] | select(.type == "file") | [.name, (.size|tostring)] | @tsv' \
            "$RUNNER_TEMP/private-assets-index.json" > artifacts/amiga-cli-probe/private-assets-index.txt
          ROM_NAME="$(jq -r '[.[] | select(.type == "file" and .size == 524288 and (.name|test("(?i)kickstart.*v?1[.]3.*34[.]5"))) ] | .[0].name // empty' "$RUNNER_TEMP/private-assets-index.json")"
          test -n "$ROM_NAME" || { echo "No 512 KiB Kickstart 1.3 rev 34.5 ROM found in private assets"; exit 1; }
          ROM_PATH_ENCODED="$(jq -rn --arg path "$ROM_NAME" '$path | @uri')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ROM_PATH_ENCODED?ref=main" \
            --output "private-kickstart/kick.rom"
          ROM_SIZE="$(wc -c < private-kickstart/kick.rom)"
          test "$ROM_SIZE" -eq 524288
          sha256sum private-kickstart/kick.rom > artifacts/amiga-cli-probe/kickstart-sha256.txt
          printf 'Kickstart candidate: %s (%s bytes)\n' "$ROM_NAME" "$ROM_SIZE" > artifacts/amiga-cli-probe/kickstart-info.txt
          printf 'KICKSTART_ROM_PATH=%s/private-kickstart/kick.rom\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install emulator and OCR
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives/" amiberry xvfb netcat-openbsd tesseract-ocr python3-pip python3-pil
          python3 -m pip install --break-system-packages amitools
          command -v xdftool
          amiberry --version | tee artifacts/amiga-cli-probe/amiberry-version.txt

      - name: Prepare DF0 test disk and preserve the original GFA BASIC disk in DF1
        env:
          GFA_CONSTRUCT_ID_INPUT: ${{ inputs.construct_id }}
          GFA_PROBE_PATH_INPUT: ${{ inputs.probe_path }}
        run: |
          set -euo pipefail
          SOURCE_ADF="$RUNNER_TEMP/gfa-basic-3.041u.adf"
          TEST_ADF="$RUNNER_TEMP/gfatest.adf"
          mkdir -p artifacts/amiga-cli-probe
          sha256sum "$SOURCE_ADF" > artifacts/amiga-cli-probe/source-adf-sha256.txt
          wc -c < "$SOURCE_ADF" > artifacts/amiga-cli-probe/source-adf-size.txt
          xdftool "$SOURCE_ADF" list / all > artifacts/amiga-cli-probe/source-adf-layout.txt
          xdftool "$SOURCE_ADF" boot show > artifacts/amiga-cli-probe/source-adf-boot.txt
          # DF1 remains the byte-for-byte original distribution ADF.
          # DF0 is a separate, writable, bootable test disk.
          xdftool "$TEST_ADF" create
          xdftool "$TEST_ADF" format GFATEST ofs
          xdftool "$TEST_ADF" makedir S
          cat > "$RUNNER_TEMP/Startup-Sequence" <<'EOF'
          DF1:gfabasic
          EOF
          xdftool "$TEST_ADF" write "$RUNNER_TEMP/Startup-Sequence" S/Startup-Sequence
          if [ -n "$GFA_PROBE_PATH_INPUT" ]; then
            test -n "$GFA_CONSTRUCT_ID_INPUT"
            test -f "$GFA_PROBE_PATH_INPUT"
            xdftool "$TEST_ADF" write "$GFA_PROBE_PATH_INPUT" gfatest.LST
            printf '%s\n' "$GFA_CONSTRUCT_ID_INPUT" > "$RUNNER_TEMP/expected-ids.txt"
            test "$(cat "$RUNNER_TEMP/expected-ids.txt")" = "$GFA_CONSTRUCT_ID_INPUT"
            test "$(wc -l < "$RUNNER_TEMP/expected-ids.txt")" -eq 1
            echo "GFATEST_EXPECTED_IDS_FILE=$RUNNER_TEMP/expected-ids.txt" >> "$GITHUB_ENV"
            echo "GFA_CONSTRUCT_ID=$GFA_CONSTRUCT_ID_INPUT" >> "$GITHUB_ENV"
          else
            xdftool "$TEST_ADF" write "tests/interpreter-probes/amiga-3.041u/regression-suite.LST" gfatest.LST
            echo "GFATEST_EXPECTED_IDS_FILE=tests/interpreter-probes/amiga-3.041u/expected-ids.txt" >> "$GITHUB_ENV"
            echo "GFA_CONSTRUCT_ID=" >> "$GITHUB_ENV"
          fi
          xdftool "$TEST_ADF" boot install boot1x
          xdftool "$TEST_ADF" list / all > artifacts/amiga-cli-probe/prepared-adf-layout.txt
          xdftool "$TEST_ADF" boot show > artifacts/amiga-cli-probe/prepared-adf-boot.txt
          grep -F "bootable: True" artifacts/amiga-cli-probe/prepared-adf-boot.txt
          sha256sum "$TEST_ADF" > artifacts/amiga-cli-probe/prepared-adf-sha256.txt
          if [ -n "$GFA_PROBE_PATH_INPUT" ]; then
            cp "$GFA_PROBE_PATH_INPUT" artifacts/amiga-cli-probe/gfatest.LST
          else
            cp "tests/interpreter-probes/amiga-3.041u/regression-suite.LST" artifacts/amiga-cli-probe/gfatest.LST
          fi
          printf '%s\\n' "DF1:gfabasic" > artifacts/amiga-cli-probe/interpreter-installed-path.txt
          cp "$RUNNER_TEMP/Startup-Sequence" artifacts/amiga-cli-probe/Startup-Sequence.txt
          grep -F "gfatest.LST" artifacts/amiga-cli-probe/prepared-adf-layout.txt
          grep -F "Startup-Sequence" artifacts/amiga-cli-probe/prepared-adf-layout.txt
          grep -F "DF1:gfabasic" artifacts/amiga-cli-probe/Startup-Sequence.txt
          test "$(wc -c < "$SOURCE_ADF")" -eq "$(wc -c < "$RUNNER_TEMP/gfa-basic-3.041u.adf")"

      - name: Merge textual LST in the GFA BASIC editor
        id: native-run
        run: bash scripts/amiga-cli-probe-3041u.sh


      - name: Write per-construct result record
        if: always() && inputs.construct_id != ''
        env:
          CONSTRUCT_ID: ${{ inputs.construct_id }}
          VERSION: "3.041U"
          PROBE_PATH: ${{ inputs.probe_path }}
          HARNESS_OUTCOME: ${{ steps.native-run.outcome }}
          RESULT_FILE: artifacts/amiga-cli-probe/gfatest-results.txt
          IDENTITY_SCREENSHOT: artifacts/amiga-cli-probe/editor-version-menu.png
          IDENTITY_OCR: artifacts/amiga-cli-probe/editor-version-menu-ocr.txt
          OUTPUT_FILE: artifacts/amiga-cli-probe/result.json
        run: |
          EXPECTED_IDS_FILE="${GFATEST_EXPECTED_IDS_FILE:-tests/interpreter-probes/amiga-3.041u/expected-ids.txt}"
          python3 scripts/write_construct_result.py \
            --construct-id "$CONSTRUCT_ID" --version "$VERSION" --probe "$PROBE_PATH" \
            --harness-outcome "${HARNESS_OUTCOME:-failure}" --expected-ids "$EXPECTED_IDS_FILE" \
            --results "$RESULT_FILE" --identity-screenshot "$IDENTITY_SCREENSHOT" \
            --identity-ocr "$IDENTITY_OCR" --output "$OUTPUT_FILE"

      - name: Upload diagnostic evidence (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.construct_id != '' && format('amiga-construct-{0}-3.041U', inputs.construct_id) || 'amiga-gfa-basic-3.041u-native-merge-run' }}
          path: |
            artifacts/amiga-cli-probe/
            !artifacts/amiga-cli-probe/*.adf
            !artifacts/amiga-cli-probe/*.rom
            !artifacts/amiga-cli-probe/gfabasic
            !artifacts/amiga-cli-probe/GFABasic
          if-no-files-found: warn
          retention-days: 7
