name: Amiga GFA BASIC 3.041U native Merge and Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/amiga-3041u-native-merge-run.yml"
      - "tests/interpreter-probes/amiga-3.041u/**"
  pull_request:
    paths:
      - ".github/workflows/amiga-3041u-native-merge-run.yml"
      - "tests/interpreter-probes/amiga-3.041u/**"
      - "scripts/validate_gfatest_results.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amiga-3041-cli-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and extract private GFA BASIC 3.041U interpreter
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p amiga-volume/S artifacts/amiga-cli-probe
          python3 -m pip install --break-system-packages amitools
          ZIP_NAME='GFA-BASIC v3.041 (1989-08-31)(GFA Systemtechnik).zip'
          ZIP_PATH_ENCODED="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ZIP_NAME")"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ZIP_PATH_ENCODED?ref=main" \
            --output "$RUNNER_TEMP/gfa-basic-3.041u.zip"
          ADF_ENTRY="$(unzip -Z1 "$RUNNER_TEMP/gfa-basic-3.041u.zip" | grep -m1 -E '\.adf$')"
          test -n "$ADF_ENTRY"
          unzip -p "$RUNNER_TEMP/gfa-basic-3.041u.zip" "$ADF_ENTRY" > "$RUNNER_TEMP/gfa-basic-3.041u.adf"
          xdftool "$RUNNER_TEMP/gfa-basic-3.041u.adf" read gfabasic amiga-volume/gfabasic
          echo "f5185db2dfc99af11a15570120f0c40df9f8ad201c28b43cc0894bfaa9562759  amiga-volume/gfabasic" | sha256sum --check
          test "$(wc -c < amiga-volume/gfabasic)" -eq 125092
          printf '\x00\x00\x03\xf3' | cmp -n 4 - amiga-volume/gfabasic
          file amiga-volume/gfabasic | tee artifacts/amiga-cli-probe/binary-info.txt
          strings -a amiga-volume/gfabasic | grep -i -E 'GFA.BASIC|Version 3.041 U|MERGE|SAVE|LIST' | head -80 > artifacts/amiga-cli-probe/binary-strings.txt || true
          sha256sum "$RUNNER_TEMP/gfa-basic-3.041u.adf" > artifacts/amiga-cli-probe/source-adf-sha256.txt

      - name: Download original Amiga Kickstart ROM
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p private-kickstart artifacts/amiga-cli-probe
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents?ref=main" \
            --output "$RUNNER_TEMP/private-assets-index.json"
          jq -r '.[] | select(.type == "file") | [.name, (.size|tostring)] | @tsv' \
            "$RUNNER_TEMP/private-assets-index.json" > artifacts/amiga-cli-probe/private-assets-index.txt
          ROM_NAME="$(jq -r '[.[] | select(.type == "file" and .size == 524288 and (.name|test("(?i)kickstart.*v?1[.]3.*34[.]5"))) ] | .[0].name // empty' "$RUNNER_TEMP/private-assets-index.json")"
          test -n "$ROM_NAME" || { echo "No 512 KiB Kickstart 1.3 rev 34.5 ROM found in private assets"; exit 1; }
          ROM_PATH_ENCODED="$(jq -rn --arg path "$ROM_NAME" '$path | @uri')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ROM_PATH_ENCODED?ref=main" \
            --output "private-kickstart/kick.rom"
          ROM_SIZE="$(wc -c < private-kickstart/kick.rom)"
          test "$ROM_SIZE" -eq 524288
          sha256sum private-kickstart/kick.rom > artifacts/amiga-cli-probe/kickstart-sha256.txt
          printf 'Kickstart candidate: %s (%s bytes)\n' "$ROM_NAME" "$ROM_SIZE" > artifacts/amiga-cli-probe/kickstart-info.txt
          printf 'KICKSTART_ROM_PATH=%s/private-kickstart/kick.rom\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install emulator and OCR
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd tesseract-ocr python3-pip python3-pil
          python3 -m pip install --break-system-packages amitools
          command -v xdftool
          amiberry --version | tee artifacts/amiga-cli-probe/amiberry-version.txt

      - name: Customize the original 3.041u ADF with fresh interpreter and tests
        run: |
          set -euo pipefail
          SOURCE_ADF="$RUNNER_TEMP/gfa-basic-3.041u.adf"
          UNPACK_ROOT="$RUNNER_TEMP/3.041u-source-unpacked"
          mkdir -p "artifacts/amiga-cli-probe"
          sha256sum "$SOURCE_ADF" > "artifacts/amiga-cli-probe/source-adf-sha256.txt"
          xdftool "$SOURCE_ADF" list / all > "artifacts/amiga-cli-probe/source-adf-layout.txt"
          xdftool "$SOURCE_ADF" unpack "$UNPACK_ROOT"
          mapfile -t VOLUME_DIRS < <(find "$UNPACK_ROOT" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#VOLUME_DIRS[@]}" -eq 1 || { echo "Expected one filesystem volume in the source ADF"; find "$UNPACK_ROOT" -maxdepth 2 -print; exit 1; }
          VOLUME_DIR="${VOLUME_DIRS[0]}"
          mapfile -t INTERPRETERS < <(find "$VOLUME_DIR" -type f -iname 'gfabasic' -print)
          test "${#INTERPRETERS[@]}" -eq 1 || { echo "Expected exactly one gfabasic in the source ADF"; find "$VOLUME_DIR" -maxdepth 3 -type f -print; exit 1; }
          INTERPRETER_PATH="${INTERPRETERS[0]}"
          # Replace the binary in-place, retaining its original path and the
          # rest of the distribution disk's directory structure and metadata.
          cp "amiga-volume/gfabasic" "$INTERPRETER_PATH"
          S_DIR="$(find "$VOLUME_DIR" -type d -iname S -print -quit)"
          if test -z "$S_DIR"; then
            S_DIR="$VOLUME_DIR/S"
            mkdir -p "$S_DIR"
          fi
          OLD_STARTUP="$(find "$VOLUME_DIR" -type f -iname Startup-Sequence -print -quit)"
          if test -n "$OLD_STARTUP"; then rm "$OLD_STARTUP"; fi
          cat > "$S_DIR/Startup-Sequence" <<'EOF'
          gfabasic
          EOF
          cp "tests/interpreter-probes/amiga-3.041u/regression-suite.LST" "$VOLUME_DIR/gfatest.LST"
          cp "$S_DIR/Startup-Sequence" "artifacts/amiga-cli-probe/Startup-Sequence.txt"
          printf '%s\n' "$INTERPRETER_PATH" > "artifacts/amiga-cli-probe/interpreter-installed-path.txt"
          printf '%s\n' "$VOLUME_DIR" > "artifacts/amiga-cli-probe/source-volume-name.txt"
          # Repack the original disk filesystem. xdftool carries the original
          # volume metadata and boot block forward; only the interpreter,
          # Startup-Sequence and our regression listing are changed.
          xdftool "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" pack "$VOLUME_DIR"
          xdftool "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" list / all > "artifacts/amiga-cli-probe/prepared-adf-layout.txt"
          xdftool "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" boot show > "artifacts/amiga-cli-probe/prepared-adf-boot.txt"
          sha256sum "artifacts/amiga-cli-probe/gfatest.adf" > "artifacts/amiga-cli-probe/prepared-adf-sha256.txt"
          cp "tests/interpreter-probes/amiga-3.041u/regression-suite.LST" "artifacts/amiga-cli-probe/gfatest.LST"
          grep -F "gfabasic" "artifacts/amiga-cli-probe/prepared-adf-layout.txt"
          grep -F "gfatest.LST" "artifacts/amiga-cli-probe/prepared-adf-layout.txt"
          grep -F "Startup-Sequence" "artifacts/amiga-cli-probe/prepared-adf-layout.txt"
          cat "artifacts/amiga-cli-probe/Startup-Sequence.txt"

      - name: Merge textual LST in the GFA BASIC editor
        run: |
          set -euo pipefail
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/amiberry.log"
          export SDL_AUDIODRIVER=dummy
          env -u SHELLOPTS xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -c '
            set +u
            set -eo pipefail
            amiberry -G -f "$RUNNER_TEMP/amiga-cli-probe.uae" -0 "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() { kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            ipc_socket_path=""
            for attempt in $(seq 1 45); do
              ipc_socket_path="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$ipc_socket_path" ]; then break; fi
              sleep 1
            done
            test -n "$ipc_socket_path" || { cat "$AMIBERRY_LOG"; exit 1; }
            sleep 35
            # Insert and verify the test ADF through Amiberry IPC.
            printf "INSERTFLOPPY\\t%s\\t0\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" | timeout 5s nc -U -N "${ipc_socket_path:-}" >"$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/insert-floppy-ipc.txt"
            printf "LIST_FLOPPIES\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" >"$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/list-floppies-ipc.txt"
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/editor-before-merge.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"

            # Amiga raw keycode 0x51 (decimal 81) is F2, the Editor Merge command.
            printf "SEND_KEY\\t81\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.3
            printf "SEND_KEY\\t81\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 3
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-dialog.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"

            # SEND_MOUSE uses relative dx/dy and the observed cursor scaling is
            # about +61 screen px for dx=380 and +35 px for dy=70.
            # Run #117 ended at (260,145), short of the gfatest.LST row center
            # (335,238). Two bounded (230,93) steps should cover the remaining
            # (+75,+93); verify the pointer screenshot before clicking.
            for _ in 1 2 3; do
              printf "SEND_MOUSE\\t380\\t70\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
              sleep 0.2
            done
            for _ in 1 2; do
              printf "SEND_MOUSE\\t230\\t93\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
              sleep 0.2
            done
            sleep 0.5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-file-row-pointer.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            printf "SEND_MOUSE\\t0\\t0\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true
            sleep 0.2
            printf "SEND_MOUSE\\t0\\t0\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true
            sleep 0.5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-file-selected.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"

            # AmigaOS requester shortcut: Left-Amiga-V activates the left gadget (Merge).
            printf "SEND_KEY\\t102\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t52\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t52\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t102\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 1
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-shortcut.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            tesseract "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-shortcut.png" stdout 2>/dev/null > "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-shortcut-ocr.txt"
            # Restore the exact calibrated Merge-gadget movement from the
            # green PR #343 workflow. The pointer is at the left edge of the
            # requester after selecting gfatest.LST; these relative moves
            # place it on the Merge gadget center (~323,420).
            for _ in 1 2; do
              printf "SEND_MOUSE\\t-177\\t183\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
              sleep 0.2
            done
            printf "SEND_MOUSE\\t206\\t198\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-gadget-pointer.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            printf "SEND_MOUSE\\t0\\t0\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_MOUSE\\t0\\t0\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 3
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-merge.png" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true

            # Native editor Run shortcut: Shift+F10 (Amiga raw keycodes).
            printf "SEND_KEY\\t96\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t89\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t89\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t96\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-run-dialog.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            printf "SEND_KEY\\t68\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t68\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            # Allow the BASIC runtime and filesystem to finish flushing the
            # interpreter-written output files before requesting emulator exit.
            sleep 3

            kill -0 "$emulator_pid"
            printf "QUIT\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true
            # QUIT is asynchronous. Wait for Amiberry to close the floppy
            # cleanly; the EXIT trap is only a timeout fallback.
            for attempt in $(seq 1 10); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Amiberry did not exit after QUIT; cleanup will terminate it."
            else
              wait "$emulator_pid" || true
            fi
          '
          xdftool artifacts/amiga-cli-probe/gfatest.adf read GFATEST.OUT artifacts/amiga-cli-probe/gfatest-results.txt
          cat artifacts/amiga-cli-probe/gfatest-results.txt
          for diagnostic in insert-floppy-ipc.txt list-floppies-ipc.txt stdin-save.LST; do
            if test -f "amiga-volume/$diagnostic"; then
              cp "amiga-volume/$diagnostic" "artifacts/amiga-cli-probe/$diagnostic"
            else
              printf "MISSING: %s\\n" "$diagnostic" > "artifacts/amiga-cli-probe/$diagnostic.missing"
            fi
          done
          for screenshot in editor-before-merge.png merge-dialog.png merge-file-row-pointer.png merge-file-selected.png after-shortcut.png merge-gadget-pointer.png after-merge.png after-run-dialog.png; do
            test -s "artifacts/amiga-cli-probe/$screenshot"
          done
          # Amiga Kickstart screenshots use bright text on a saturated blue background.
          # Normalize/invert/upscale before OCR; default Tesseract silently missed the source text.
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          image = Image.open("artifacts/amiga-cli-probe/after-merge.png").convert("L")
          image = ImageOps.invert(image).resize((image.width * 3, image.height * 3))
          image = ImageEnhance.Contrast(image).enhance(3)
          image.save("artifacts/amiga-cli-probe/after-merge-ocr-input.png")
          PY
          tesseract artifacts/amiga-cli-probe/after-merge-ocr-input.png stdout --psm 6 2>/dev/null | tee artifacts/amiga-cli-probe/after-merge-ocr.txt
          if ! grep -Fqi 'Merge File' artifacts/amiga-cli-probe/after-merge-ocr.txt && grep -Fqi 'GFATEST' artifacts/amiga-cli-probe/after-merge-ocr.txt; then
            echo "EDITOR_MERGE_LST_CONTENT_VISIBLE=yes" | tee artifacts/amiga-cli-probe/result.txt
          else
            echo "EDITOR_MERGE_LST_CONTENT_VISIBLE=no" | tee artifacts/amiga-cli-probe/result.txt
            echo "::error::The editor screenshot does not show the merged LST source."
            exit 1
          fi

          # Validate one interpreter-emitted terminal record for every requested
          # fixture. The BASIC program performs each assertion before writing
          # PASS/FAIL; the host only validates collection completeness.
          python3 scripts/validate_gfatest_results.py \
            --expected-ids tests/interpreter-probes/amiga-3.041u/expected-ids.txt \
            --results artifacts/amiga-cli-probe/gfatest-results.txt


      - name: Upload diagnostic evidence (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-3.041u-native-merge-run
          path: artifacts/amiga-cli-probe/
          if-no-files-found: warn
          retention-days: 7
)"
          test -n "$ADF_ENTRY"
          unzip -p "$RUNNER_TEMP/gfa-basic-3.041u.zip" "$ADF_ENTRY" > "$RUNNER_TEMP/gfa-basic-3.041u.adf"
          xdftool "$RUNNER_TEMP/gfa-basic-3.041u.adf" read gfabasic amiga-volume/gfabasic
          echo "f5185db2dfc99af11a15570120f0c40df9f8ad201c28b43cc0894bfaa9562759  amiga-volume/gfabasic" | sha256sum --check
          test "$(wc -c < amiga-volume/gfabasic)" -eq 125092
          printf '\\x00\\x00\\x03\\xf3' | cmp -n 4 - amiga-volume/gfabasic
          file amiga-volume/gfabasic | tee artifacts/amiga-cli-probe/binary-info.txt
          strings -a amiga-volume/gfabasic | grep -i -E 'GFA.BASIC|Version 3.041 U|MERGE|SAVE|LIST' | head -80 > artifacts/amiga-cli-probe/binary-strings.txt || true
          sha256sum "$RUNNER_TEMP/gfa-basic-3.041u.adf" > artifacts/amiga-cli-probe/source-adf-sha256.txt

      - name: Download original Amiga Kickstart ROM
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p private-kickstart artifacts/amiga-cli-probe
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents?ref=main" \
            --output "$RUNNER_TEMP/private-assets-index.json"
          jq -r '.[] | select(.type == "file") | [.name, (.size|tostring)] | @tsv' \
            "$RUNNER_TEMP/private-assets-index.json" > artifacts/amiga-cli-probe/private-assets-index.txt
          ROM_NAME="$(jq -r '[.[] | select(.type == "file" and .size == 524288 and (.name|test("(?i)kickstart.*v?1[.]3.*34[.]5"))) ] | .[0].name // empty' "$RUNNER_TEMP/private-assets-index.json")"
          test -n "$ROM_NAME" || { echo "No 512 KiB Kickstart 1.3 rev 34.5 ROM found in private assets"; exit 1; }
          ROM_PATH_ENCODED="$(jq -rn --arg path "$ROM_NAME" '$path | @uri')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ROM_PATH_ENCODED?ref=main" \
            --output "private-kickstart/kick.rom"
          ROM_SIZE="$(wc -c < private-kickstart/kick.rom)"
          test "$ROM_SIZE" -eq 524288
          sha256sum private-kickstart/kick.rom > artifacts/amiga-cli-probe/kickstart-sha256.txt
          printf 'Kickstart candidate: %s (%s bytes)\n' "$ROM_NAME" "$ROM_SIZE" > artifacts/amiga-cli-probe/kickstart-info.txt
          printf 'KICKSTART_ROM_PATH=%s/private-kickstart/kick.rom\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install emulator and OCR
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd tesseract-ocr python3-pip python3-pil
          python3 -m pip install --break-system-packages amitools
          command -v xdftool
          amiberry --version | tee artifacts/amiga-cli-probe/amiberry-version.txt

      - name: Prepare CLI input and boot volume
        run: |
          cp tests/interpreter-probes/amiga-3.041u/regression-suite.LST amiga-volume/gfatest.LST
          # Build a bootable AmigaDOS 1.x OFS floppy. Kickstart 1.3 has no
          # built-in Workbench/CLI disk, so the boot block and Startup-Sequence
          # must live on the same disk as the interpreter and textual listing.
          mkdir -p amiga-volume/S
          cp amiga-volume/gfabasic amiga-volume/gfabasic.bin
          cat > amiga-volume/S/Startup-Sequence <<'EOF'
          gfabasic
          EOF
          xdftool artifacts/amiga-cli-probe/gfatest.adf create + format GFABASIC3041 ofs + write amiga-volume/gfatest.LST + write amiga-volume/gfabasic + write amiga-volume/S
          xdftool artifacts/amiga-cli-probe/gfatest.adf boot install boot1x
          xdftool artifacts/amiga-cli-probe/gfatest.adf info > artifacts/amiga-cli-probe/gfatest-adf-info.txt
          xdftool artifacts/amiga-cli-probe/gfatest.adf list / all > artifacts/amiga-cli-probe/gfatest-adf-list.txt
          xdftool artifacts/amiga-cli-probe/gfatest.adf boot show > artifacts/amiga-cli-probe/gfatest-adf-boot.txt
          cp amiga-volume/gfatest.LST artifacts/amiga-cli-probe/gfatest.LST
          cp amiga-volume/S/Startup-Sequence artifacts/amiga-cli-probe/Startup-Sequence.txt
          cat > "$RUNNER_TEMP/amiga-cli-probe.uae" <<EOF
          use_gui=no
          cpu_type=68000
          chipset=ocs
          kickstart_rom_file=$KICKSTART_ROM_PATH
          chipmem_size=2
          fastmem_size=8
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          floppy0=$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf
          EOF

      - name: Merge textual LST in the GFA BASIC editor
        run: |
          set -euo pipefail
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/amiberry.log"
          export SDL_AUDIODRIVER=dummy
          env -u SHELLOPTS xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -c '
            set +u
            set -eo pipefail
            amiberry -G -f "$RUNNER_TEMP/amiga-cli-probe.uae" -0 "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() { kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            ipc_socket_path=""
            for attempt in $(seq 1 45); do
              ipc_socket_path="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$ipc_socket_path" ]; then break; fi
              sleep 1
            done
            test -n "$ipc_socket_path" || { cat "$AMIBERRY_LOG"; exit 1; }
            sleep 35
            # Insert and verify the test ADF through Amiberry IPC.
            printf "INSERTFLOPPY\\t%s\\t0\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/gfatest.adf" | timeout 5s nc -U -N "${ipc_socket_path:-}" >"$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/insert-floppy-ipc.txt"
            printf "LIST_FLOPPIES\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" >"$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/list-floppies-ipc.txt"
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/editor-before-merge.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"

            # Amiga raw keycode 0x51 (decimal 81) is F2, the Editor Merge command.
            printf "SEND_KEY\\t81\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.3
            printf "SEND_KEY\\t81\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 3
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-dialog.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"

            # SEND_MOUSE uses relative dx/dy and the observed cursor scaling is
            # about +61 screen px for dx=380 and +35 px for dy=70.
            # Run #117 ended at (260,145), short of the gfatest.LST row center
            # (335,238). Two bounded (230,93) steps should cover the remaining
            # (+75,+93); verify the pointer screenshot before clicking.
            for _ in 1 2 3; do
              printf "SEND_MOUSE\\t380\\t70\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
              sleep 0.2
            done
            for _ in 1 2; do
              printf "SEND_MOUSE\\t230\\t93\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
              sleep 0.2
            done
            sleep 0.5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-file-row-pointer.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            printf "SEND_MOUSE\\t0\\t0\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true
            sleep 0.2
            printf "SEND_MOUSE\\t0\\t0\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true
            sleep 0.5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-file-selected.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"

            # AmigaOS requester shortcut: Left-Amiga-V activates the left gadget (Merge).
            printf "SEND_KEY\\t102\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t52\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t52\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t102\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 1
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-shortcut.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            tesseract "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-shortcut.png" stdout 2>/dev/null > "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-shortcut-ocr.txt"
            # Restore the exact calibrated Merge-gadget movement from the
            # green PR #343 workflow. The pointer is at the left edge of the
            # requester after selecting gfatest.LST; these relative moves
            # place it on the Merge gadget center (~323,420).
            for _ in 1 2; do
              printf "SEND_MOUSE\\t-177\\t183\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
              sleep 0.2
            done
            printf "SEND_MOUSE\\t206\\t198\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-gadget-pointer.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            printf "SEND_MOUSE\\t0\\t0\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_MOUSE\\t0\\t0\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 3
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-merge.png" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true

            # Native editor Run shortcut: Shift+F10 (Amiga raw keycodes).
            printf "SEND_KEY\\t96\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t89\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t89\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t96\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-run-dialog.png" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            printf "SEND_KEY\\t68\\t1\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            sleep 0.2
            printf "SEND_KEY\\t68\\t0\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}"
            # Allow the BASIC runtime and filesystem to finish flushing the
            # interpreter-written output files before requesting emulator exit.
            sleep 3

            kill -0 "$emulator_pid"
            printf "QUIT\\n" | timeout 5s nc -U -N "${ipc_socket_path:-}" || true
            # QUIT is asynchronous. Wait for Amiberry to close the floppy
            # cleanly; the EXIT trap is only a timeout fallback.
            for attempt in $(seq 1 10); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Amiberry did not exit after QUIT; cleanup will terminate it."
            else
              wait "$emulator_pid" || true
            fi
          '
          xdftool artifacts/amiga-cli-probe/gfatest.adf read GFATEST.OUT artifacts/amiga-cli-probe/gfatest-results.txt
          cat artifacts/amiga-cli-probe/gfatest-results.txt
          for diagnostic in insert-floppy-ipc.txt list-floppies-ipc.txt stdin-save.LST; do
            if test -f "amiga-volume/$diagnostic"; then
              cp "amiga-volume/$diagnostic" "artifacts/amiga-cli-probe/$diagnostic"
            else
              printf "MISSING: %s\\n" "$diagnostic" > "artifacts/amiga-cli-probe/$diagnostic.missing"
            fi
          done
          for screenshot in editor-before-merge.png merge-dialog.png merge-file-row-pointer.png merge-file-selected.png after-shortcut.png merge-gadget-pointer.png after-merge.png after-run-dialog.png; do
            test -s "artifacts/amiga-cli-probe/$screenshot"
          done
          # Amiga Kickstart screenshots use bright text on a saturated blue background.
          # Normalize/invert/upscale before OCR; default Tesseract silently missed the source text.
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          image = Image.open("artifacts/amiga-cli-probe/after-merge.png").convert("L")
          image = ImageOps.invert(image).resize((image.width * 3, image.height * 3))
          image = ImageEnhance.Contrast(image).enhance(3)
          image.save("artifacts/amiga-cli-probe/after-merge-ocr-input.png")
          PY
          tesseract artifacts/amiga-cli-probe/after-merge-ocr-input.png stdout --psm 6 2>/dev/null | tee artifacts/amiga-cli-probe/after-merge-ocr.txt
          if ! grep -Fqi 'Merge File' artifacts/amiga-cli-probe/after-merge-ocr.txt && grep -Fqi 'GFATEST' artifacts/amiga-cli-probe/after-merge-ocr.txt; then
            echo "EDITOR_MERGE_LST_CONTENT_VISIBLE=yes" | tee artifacts/amiga-cli-probe/result.txt
          else
            echo "EDITOR_MERGE_LST_CONTENT_VISIBLE=no" | tee artifacts/amiga-cli-probe/result.txt
            echo "::error::The editor screenshot does not show the merged LST source."
            exit 1
          fi

          # Validate one interpreter-emitted terminal record for every requested
          # fixture. The BASIC program performs each assertion before writing
          # PASS/FAIL; the host only validates collection completeness.
          python3 scripts/validate_gfatest_results.py \
            --expected-ids tests/interpreter-probes/amiga-3.041u/expected-ids.txt \
            --results artifacts/amiga-cli-probe/gfatest-results.txt


      - name: Upload diagnostic evidence (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-3.041u-native-merge-run
          path: artifacts/amiga-cli-probe/
          if-no-files-found: warn
          retention-days: 7
