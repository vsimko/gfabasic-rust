name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".lychee.toml"
      - ".github/workflows/docs.yml"
      - "api/**"
      - "scripts/**"
      - "site/**"
      - "tests/corpus/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".lychee.toml"
      - ".github/workflows/docs.yml"
      - "api/**"
      - "scripts/**"
      - "site/**"
      - "tests/corpus/**"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Check site JavaScript syntax
        run: node --check site/script.js

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "#node_modules"

  api-registry:
    name: API registry validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate registry
        run: python scripts/validate_api_registry.py

      - name: Validate stored AI review results
        run: python scripts/validate_api_reviews.py

      - name: Validate corpus metadata
        run: python scripts/validate_corpus.py

      - name: Validate Amiga function inventory
        run: python scripts/validate_amiga_function_inventory.py

      - name: Run registry validator tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  local-links:
    name: Local Markdown links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check local links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --verbose --no-progress --config .lychee.toml "./**/*.md"
          lycheeVersion: v0.24.2
