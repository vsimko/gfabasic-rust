name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".lychee.toml"
      - ".github/workflows/docs.yml"
      - "api/**"
      - "scripts/**"
      - "tests/corpus/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".lychee.toml"
      - ".github/workflows/docs.yml"
      - "api/**"
      - "scripts/**"
      - "tests/corpus/**"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "#node_modules"

  api-registry:
    name: API registry validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Validate registry
        run: python scripts/validate_api_registry.py

      - name: Run registry validator tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  local-links:
    name: Local Markdown links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check local links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --verbose --no-progress --config .lychee.toml "./**/*.md"
          lycheeVersion: v0.24.2
