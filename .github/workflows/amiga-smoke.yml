name: Amiga emulator smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/amiga-smoke.yml"

permissions:
  contents: read

concurrency:
  group: amiga-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot-amiga:
    name: Boot Amiga and capture output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Amiberry and virtual display
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key \
            | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" \
            | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd
          amiberry --version

      - name: Prepare a bootable directory volume
        run: |
          mkdir -p amiga-volume/S artifacts/amiga-smoke
          cat > amiga-volume/S/Startup-Sequence <<'EOF'
          Echo "AMIGA CI: BOOTED"
          Echo "Amiberry emulator with the bundled AROS fallback ROM"
          Echo "AMIGA-CI: PASS" >PAR:
          Wait 10
          EOF

          cat > "$RUNNER_TEMP/amiga-smoke.uae" <<EOF
          use_gui=no
          cpu_type=68000
          chipset=ocs
          chipmem_size=2
          fastmem_size=0
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          filesystem2=rw,DH0:CI:$GITHUB_WORKSPACE/amiga-volume,0
          EOF

          cp amiga-volume/S/Startup-Sequence artifacts/amiga-smoke/Startup-Sequence.txt
          cat "$RUNNER_TEMP/amiga-smoke.uae"

      - name: Boot Amiga, collect printer text and screenshot
        run: |
          set -euo pipefail
          export PRINTER_LOG="$GITHUB_WORKSPACE/artifacts/amiga-smoke/printer.txt"
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-smoke/amiberry.log"
          export SCREENSHOT="$GITHUB_WORKSPACE/artifacts/amiga-smoke/amiga-screen.png"
          export SDL_AUDIODRIVER=dummy
          touch "$PRINTER_LOG"

          xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -euo pipefail -c '
            amiberry -G -f "$RUNNER_TEMP/amiga-smoke.uae" -p "$PRINTER_LOG" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() {
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            socket=""
            for attempt in $(seq 1 20); do
              socket="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$socket" ]; then
                break
              fi
              sleep 1
            done
            if [ -z "$socket" ]; then
              echo "Amiberry IPC socket was not created"
              cat "$AMIBERRY_LOG"
              exit 1
            fi

            timeout 5s bash -c 'printf "SCREENSHOT\\t%s\\n" "$1" | nc -U "$2"' _ "$SCREENSHOT" "$socket"
            for attempt in $(seq 1 10); do
              [ -s "$SCREENSHOT" ] && break
              sleep 1
            done
            test -s "$SCREENSHOT"

            for attempt in $(seq 1 45); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                echo "Amiberry exited before the smoke test completed"
                cat "$AMIBERRY_LOG"
                exit 1
              fi
              if grep -q "AMIGA-CI: PASS" "$PRINTER_LOG" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if ! grep -q "AMIGA-CI: PASS" "$PRINTER_LOG" 2>/dev/null; then
              echo "Did not receive the expected Amiga printer output"
              cat "$AMIBERRY_LOG"
              test -f "$PRINTER_LOG" && cat "$PRINTER_LOG" || true
              exit 1
            fi

            cat "$PRINTER_LOG"
            timeout 5s bash -c 'printf "QUIT\\n" | nc -U "$1"' _ "$socket" || true
          '

          grep -q "AMIGA-CI: PASS" "$PRINTER_LOG"

      - name: Upload Amiga output and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-smoke-test
          path: artifacts/amiga-smoke/
          if-no-files-found: warn
          retention-days: 7
