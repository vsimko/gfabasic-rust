name: Amiga emulator smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/amiga-smoke.yml"

permissions:
  contents: read

concurrency:
  group: amiga-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot-amiga:
    name: Boot AROS and launch GFA BASIC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and verify private GFA BASIC interpreter
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN" || {
            echo "::error::GFA_ASSETS_TOKEN is not configured."
            exit 1
          }
          mkdir -p amiga-volume artifacts/amiga-smoke
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/GFABasic?ref=main" \
            --output amiga-volume/GFABasic
          echo "fd80f6093e8d0163856af5849121e945e37051a2ad2a9053aa1930021783d962  amiga-volume/GFABasic" | sha256sum --check
          test "$(wc -c < amiga-volume/GFABasic)" -eq 136548
          printf '\x00\x00\x03\xf3' | cmp -n 4 - amiga-volume/GFABasic
          file amiga-volume/GFABasic | tee artifacts/amiga-smoke/gfa-basic-file.txt

      - name: Prepare APT cache
        run: sudo chown -R "$USER":"$USER" /var/cache/apt/archives

      - name: Cache downloaded APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-amiga-apt-v1
          restore-keys: |
            ${{ runner.os }}-amiga-apt-

      - name: Install Amiberry and virtual display
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key \
            | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" \
            | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          # Keep downloaded archives: Ubuntu's APT defaults may remove them
          # after installation, leaving nothing for actions/cache to save.
          sudo apt-get -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends amiberry xvfb netcat-openbsd xdotool
          amiberry --version | tee artifacts/amiga-smoke/amiberry-version.txt

      - name: Prepare boot volume
        run: |
          mkdir -p amiga-volume/S
          cat > amiga-volume/S/Startup-Sequence <<'EOF'
          Echo "AMIGA CI: BOOTED"
          Echo "Amiberry AROS fallback ROM"
          Run >NIL: DH0:GFABasic
          If WARN
            Echo "GFA BASIC launch failed" >DH0:gfa-basic-launch.txt
          Else
            Echo "GFA BASIC launch command accepted" >DH0:gfa-basic-launch.txt
          EndIf
          EOF

          cp amiga-volume/S/Startup-Sequence artifacts/amiga-smoke/Startup-Sequence.txt
          cat > amiga-volume/factzero.LST <<'EOF'
          x = FACT(0)
          y = FACT(1)
          z = FACT(2)
          PRINT x, y, z
          EOF
          cp amiga-volume/factzero.LST artifacts/amiga-smoke/factzero.LST
          cat > "$RUNNER_TEMP/amiga-smoke.uae" <<EOF
          use_gui=no
          cpu_type=68020
          chipset=ecs
          chipmem_size=2
          fastmem_size=8
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          filesystem2=rw,DH0:CI:$GITHUB_WORKSPACE/amiga-volume,0
          EOF

      - name: Boot AROS and verify GFA BASIC launch
        run: |
          set -euo pipefail
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-smoke/amiberry.log"
          export SCREENSHOT="$GITHUB_WORKSPACE/artifacts/amiga-smoke/amiga-screen.png"
          export RESULT="$GITHUB_WORKSPACE/amiga-volume/gfa-basic-launch.txt"
          export SDL_AUDIODRIVER=dummy

          # Do not pass the runner's exported SHELLOPTS (which includes nounset)
          # through xvfb-run into its nested Bash process.
          env -u SHELLOPTS xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -c '
            set -eo pipefail
            amiberry -G -f "$RUNNER_TEMP/amiga-smoke.uae" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() {
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            ipc_socket_path=""
            for attempt in $(seq 1 30); do
              ipc_socket_path="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$ipc_socket_path" ]; then
                break
              fi
              sleep 1
            done
            if [ -z "$ipc_socket_path" ]; then
              echo "Amiberry IPC socket was not created"
              cat "$AMIBERRY_LOG"
              exit 1
            fi

            for attempt in $(seq 1 45); do
              if [ -s "$RESULT" ]; then
                break
              fi
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                echo "Amiberry exited before the guest launched GFA BASIC"
                cat "$AMIBERRY_LOG"
                exit 1
              fi
              sleep 1
            done

            if ! grep -q "GFA BASIC launch command accepted" "$RESULT" 2>/dev/null; then
              echo "AROS did not successfully start the GFA BASIC executable"
              cat "$AMIBERRY_LOG"
              test -f "$RESULT" && cat "$RESULT" || true
              exit 1
            fi

            # Retry synthetic input under the 68020/ECS guest profile.
            # Amiga raw keycode 0x20 is the A key; press and release it explicitly.
            sleep 5
            printf "SEND_KEY\\t32\\t1\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/input-press.txt"
            sleep 1
            printf "SEND_KEY\\t32\\t0\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/input-release.txt"
            sleep 2
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-smoke/after-a-input.png" | timeout 5s nc -U -N "$ipc_socket_path"
            # Amiga raw keycode 0x51 (decimal 81) is F2, the editor Merge command.
            printf "SEND_KEY\\t81\\t1\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-key-press.txt"
            sleep 1
            printf "SEND_KEY\\t81\\t0\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-key-release.txt"
            sleep 3
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-dialog.png" | timeout 5s nc -U -N "$ipc_socket_path"

            # The Merge requester opens with its filename gadget focused.
            # Type factzero.lst using Amiga raw keycodes (lowercase ASCII).
            send_key() {
              printf "SEND_KEY\\t%s\\t1\\n" "$1" | timeout 5s nc -U -N "$ipc_socket_path" >/dev/null
              sleep 0.15
              printf "SEND_KEY\\t%s\\t0\\n" "$1" | timeout 5s nc -U -N "$ipc_socket_path" >/dev/null
              sleep 0.15
            }
            for keycode in 35 32 51 20 49 18 19 24 57 40 33 20; do
              send_key "$keycode"
            done
            # Raw keycode 0x39 (57) is the Amiga period key.
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-filename.png" | timeout 5s nc -U -N "$ipc_socket_path"
            # Tab advances from the filename gadget to the requester
            # action gadget; Space activates the focused button.
            printf "SEND_KEY\\t66\\t1\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-tab-press.txt"
            sleep 0.3
            printf "SEND_KEY\\t66\\t0\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-tab-release.txt"
            sleep 1
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-smoke/before-merge-click.png" | timeout 5s nc -U -N "$ipc_socket_path"
            printf "SEND_KEY\\t64\\t1\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-space-press.txt"
            sleep 0.3
            printf "SEND_KEY\\t64\\t0\\n" | timeout 5s nc -U -N "$ipc_socket_path" | tee "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-space-release.txt"
            sleep 5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-smoke/after-merge-click.png" | timeout 5s nc -U -N "$ipc_socket_path"
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Amiberry exited after synthetic keyboard input"
              cat "$AMIBERRY_LOG"
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/artifacts/amiga-smoke/merge-dialog.png" "$SCREENSHOT"
            test -s "$SCREENSHOT"
            cat "$RESULT"
            printf "QUIT\\n" | timeout 5s nc -U -N "$ipc_socket_path" || true
          '

          cp "$RESULT" artifacts/amiga-smoke/guest-output.txt
          grep -q "GFA BASIC launch command accepted" artifacts/amiga-smoke/guest-output.txt

      - name: Upload boot log and screenshot (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-aros-smoke
          path: artifacts/amiga-smoke/
          if-no-files-found: warn
          retention-days: 7
