name: Amiga emulator smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/amiga-smoke.yml"

permissions:
  contents: read

concurrency:
  group: amiga-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot-amiga:
    name: Boot Amiga and capture output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare APT cache
        run: sudo chown -R "$USER":"$USER" /var/cache/apt/archives

      - name: Cache downloaded APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-amiga-apt-v1
          restore-keys: |
            ${{ runner.os }}-amiga-apt-

      - name: Install Amiberry and virtual display
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key \
            | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" \
            | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd
          amiberry --version

      - name: Prepare boot volume
        run: |
          mkdir -p amiga-volume/S artifacts/amiga-smoke
          cat > amiga-volume/S/Startup-Sequence <<'EOF'
          Echo "AMIGA CI: BOOTED"
          Echo "Amiberry AROS fallback ROM"
          Echo "AMIGA-CI: PASS" >DH0:ci-result.txt
          EOF

          cp amiga-volume/S/Startup-Sequence artifacts/amiga-smoke/Startup-Sequence.txt
          cat > "$RUNNER_TEMP/amiga-smoke.uae" <<EOF
          use_gui=no
          cpu_type=68000
          chipset=ocs
          chipmem_size=2
          fastmem_size=0
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          filesystem2=rw,DH0:CI:$GITHUB_WORKSPACE/amiga-volume,0
          EOF

      - name: Boot Amiga and capture guest text and screenshot
        run: |
          set -euo pipefail
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-smoke/amiberry.log"
          export SCREENSHOT="$GITHUB_WORKSPACE/artifacts/amiga-smoke/amiga-screen.png"
          export RESULT="$GITHUB_WORKSPACE/amiga-volume/ci-result.txt"
          export SDL_AUDIODRIVER=dummy

          xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -euo pipefail -c '
            amiberry -G -f "$RUNNER_TEMP/amiga-smoke.uae" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() {
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            socket=""
            for attempt in $(seq 1 30); do
              socket="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$socket" ]; then
                break
              fi
              sleep 1
            done
            if [ -z "$socket" ]; then
              echo "Amiberry IPC socket was not created"
              cat "$AMIBERRY_LOG"
              exit 1
            fi

            for attempt in $(seq 1 45); do
              if [ -s "$RESULT" ]; then
                break
              fi
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                echo "Amiberry exited before the guest wrote its result"
                cat "$AMIBERRY_LOG"
                exit 1
              fi
              sleep 1
            done

            if ! grep -q "AMIGA-CI: PASS" "$RESULT" 2>/dev/null; then
              echo "Amiga guest did not write the expected result"
              cat "$AMIBERRY_LOG"
              test -f "$RESULT" && cat "$RESULT" || true
              exit 1
            fi

            printf "SCREENSHOT\\t%s\\n" "$SCREENSHOT" | timeout 5s nc -U -N "$socket"
            test -s "$SCREENSHOT"
            cat "$RESULT"
            printf "QUIT\\n" | timeout 5s nc -U -N "$socket" || true
          '

          cp "$RESULT" artifacts/amiga-smoke/guest-output.txt
          grep -q "AMIGA-CI: PASS" artifacts/amiga-smoke/guest-output.txt

      - name: Upload Amiga output and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-smoke-test
          path: artifacts/amiga-smoke/
          if-no-files-found: warn
          retention-days: 7
