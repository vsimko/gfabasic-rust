name: Refresh public PDF source index

on:
  push:
    branches: [main]
    paths:
      - "references/pdf-sources.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-pdf-source-index
  cancel-in-progress: false

jobs:
  refresh-index:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check "pypdf==6.1.3"

      - name: Build index for changed manifest sources
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python scripts/build_reference_source_index.py \
            --manifest references/pdf-sources.json \
            --base-sha "${BASE_SHA:-}" \
            --output "$RUNNER_TEMP/source-index.json"
          test -s "$RUNNER_TEMP/source-index.json"

      - name: Propose index through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/public-pdf-source-index"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch" origin/main
          fi
          git reset --hard origin/main
          cp "$RUNNER_TEMP/source-index.json" references/source-index.json
          git add references/source-index.json
          if git diff --cached --quiet; then
            echo "Source index is already current."
            exit 0
          fi
          git commit -m "Refresh public GFA BASIC source index"
          git push --force-with-lease origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Updated existing source-index pull request."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Refresh public GFA BASIC source index" \
              --body "Updates the generated source index from references/pdf-sources.json. Only sources whose manifest entries changed are downloaded and re-extracted. Source PDFs remain outside the repository; extracted text is included only where the manifest records the project-approved rights basis."
          fi
