name: Amiga GFA BASIC 3.52 native Merge and Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/amiga-35u-native-merge-run.yml"
      - "tests/interpreter-probes/amiga-3.52/**"
      - "scripts/amiga-cli-probe-35u.sh"
      - "scripts/amiga-cli-probe-35u-emulator.sh"
      - "scripts/validate_gfatest_results.py"
  pull_request:
    paths:
      - ".github/workflows/amiga-35u-native-merge-run.yml"
      - "tests/interpreter-probes/amiga-3.52/**"
      - "scripts/amiga-cli-probe-35u.sh"
      - "scripts/amiga-cli-probe-35u-emulator.sh"
      - "scripts/validate_gfatest_results.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and extract private GFA BASIC 3.52 interpreter
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p amiga-volume/S artifacts/amiga-cli-probe
          python3 -m pip install --break-system-packages amitools
          ZIP_NAME='GFA-BASIC v3.52 (1990)(GFA Systemtechnik)(DE)(Disk 1 of 2)[WB].zip'
          ZIP_PATH_ENCODED="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ZIP_NAME")"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ZIP_PATH_ENCODED?ref=main" \
            --output "$RUNNER_TEMP/gfa-basic-3.52.zip"
          python3 - "$RUNNER_TEMP/gfa-basic-3.52.zip" <<'PY'
          import hashlib
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          blob_sha = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          expected = "3c14e037559c2c2e1c0ae96088a7a7689594e4f5"
          if blob_sha != expected:
              raise SystemExit(f"Unexpected GFA-BASIC 3.52 ZIP Git blob SHA: {blob_sha}")
          print(f"GFA_BASIC_ZIP_GIT_BLOB_SHA={blob_sha}")
          print(f"GFA_BASIC_ZIP_SIZE={len(data)}")
          PY
          printf '%s\n' "$ZIP_NAME" > artifacts/amiga-cli-probe/interpreter-zip-name.txt
          sha256sum "$RUNNER_TEMP/gfa-basic-3.52.zip" > artifacts/amiga-cli-probe/interpreter-zip-sha256.txt

      - name: Download original Amiga Kickstart ROM
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p private-kickstart artifacts/amiga-cli-probe
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents?ref=main" \
            --output "$RUNNER_TEMP/private-assets-index.json"
          jq -r '.[] | select(.type == "file") | [.name, (.size|tostring)] | @tsv' \
            "$RUNNER_TEMP/private-assets-index.json" > artifacts/amiga-cli-probe/private-assets-index.txt
          ROM_NAME="$(jq -r '[.[] | select(.type == "file" and .size == 524288 and (.name|test("(?i)kickstart.*v?1[.]3.*34[.]5"))) ] | .[0].name // empty' "$RUNNER_TEMP/private-assets-index.json")"
          test -n "$ROM_NAME" || { echo "No 512 KiB Kickstart 1.3 rev 34.5 ROM found in private assets"; exit 1; }
          ROM_PATH_ENCODED="$(jq -rn --arg path "$ROM_NAME" '$path | @uri')"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/$ROM_PATH_ENCODED?ref=main" \
            --output "private-kickstart/kick.rom"
          ROM_SIZE="$(wc -c < private-kickstart/kick.rom)"
          test "$ROM_SIZE" -eq 524288
          sha256sum private-kickstart/kick.rom > artifacts/amiga-cli-probe/kickstart-sha256.txt
          printf 'Kickstart candidate: %s (%s bytes)\n' "$ROM_NAME" "$ROM_SIZE" > artifacts/amiga-cli-probe/kickstart-info.txt
          printf 'KICKSTART_ROM_PATH=%s/private-kickstart/kick.rom\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install emulator and OCR
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd tesseract-ocr python3-pip python3-pil
          python3 -m pip install --break-system-packages amitools
          command -v xdftool
          amiberry --version | tee artifacts/amiga-cli-probe/amiberry-version.txt

      - name: Prepare DF0 test disk and preserve the original GFA BASIC disk in DF1
        run: |
          set -euo pipefail
          TEST_ADF="$RUNNER_TEMP/gfatest.adf"
          mkdir -p artifacts/amiga-cli-probe
          # The original 3.52 distribution ZIP is mounted directly as DF1.
          # Amiberry opens the compressed floppy read-only; do not extract or
          # rewrite the commercial disk image.
          xdftool "$TEST_ADF" create
          xdftool "$TEST_ADF" format GFATEST ofs
          xdftool "$TEST_ADF" makedir S
          cat > "$RUNNER_TEMP/Startup-Sequence" <<'EOF'
          DF1:GFABasic
          EOF
          xdftool "$TEST_ADF" write "$RUNNER_TEMP/Startup-Sequence" S/Startup-Sequence
          xdftool "$TEST_ADF" write "tests/interpreter-probes/amiga-3.52/regression-suite.LST" gfatest.LST
          xdftool "$TEST_ADF" boot install boot1x
          xdftool "$TEST_ADF" list / all > artifacts/amiga-cli-probe/prepared-adf-layout.txt
          xdftool "$TEST_ADF" boot show > artifacts/amiga-cli-probe/prepared-adf-boot.txt
          grep -F "bootable: True" artifacts/amiga-cli-probe/prepared-adf-boot.txt
          sha256sum "$TEST_ADF" > artifacts/amiga-cli-probe/prepared-adf-sha256.txt
          cp "tests/interpreter-probes/amiga-3.52/regression-suite.LST" artifacts/amiga-cli-probe/gfatest.LST
          printf '%s\n' "DF1:GFABasic (GFA-BASIC 3.52 ZIP, read-only)" > artifacts/amiga-cli-probe/interpreter-installed-path.txt
          cp "$RUNNER_TEMP/Startup-Sequence" artifacts/amiga-cli-probe/Startup-Sequence.txt
          grep -F "gfatest.LST" artifacts/amiga-cli-probe/prepared-adf-layout.txt
          grep -F "Startup-Sequence" artifacts/amiga-cli-probe/prepared-adf-layout.txt
          grep -F "DF1:GFABasic" artifacts/amiga-cli-probe/Startup-Sequence.txt

      - name: Merge textual LST in the GFA BASIC editor
        run: bash scripts/amiga-cli-probe-35u.sh


      - name: Upload diagnostic evidence (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-3.52-native-merge-run
          path: |
            artifacts/amiga-cli-probe/
            !artifacts/amiga-cli-probe/*.adf
          if-no-files-found: warn
          retention-days: 7
