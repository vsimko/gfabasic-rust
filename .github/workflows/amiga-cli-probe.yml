name: Amiga GFA BASIC CLI/stdin probe

on:
  pull_request:
    paths:
      - ".github/workflows/amiga-cli-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amiga-cli-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and verify private GFA BASIC interpreter
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p amiga-volume/S artifacts/amiga-cli-probe
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/GFABasic?ref=main" \
            --output amiga-volume/GFABasic
          echo "fd80f6093e8d0163856af5849121e945e37051a2ad2a9053aa1930021783d962  amiga-volume/GFABasic" | sha256sum --check
          test "$(wc -c < amiga-volume/GFABasic)" -eq 136548
          printf '\\x00\\x00\\x03\\xf3' | cmp -n 4 - amiga-volume/GFABasic
          file amiga-volume/GFABasic | tee artifacts/amiga-cli-probe/binary-info.txt
          strings -a amiga-volume/GFABasic | grep -i -E 'MERGE|SAVE|LIST|DOSCMD|GFA.BASIC' | head -80 > artifacts/amiga-cli-probe/binary-strings.txt || true

      - name: Install emulator and OCR
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd tesseract-ocr
          amiberry --version | tee artifacts/amiga-cli-probe/amiberry-version.txt

      - name: Prepare CLI input and boot volume
        run: |
          cat > amiga-volume/factzero.LST <<'EOF'
          x = FACT(0)
          y = FACT(1)
          z = FACT(2)
          PRINT x, y, z
          EOF
          # If the process attaches its standard input to a command console,
          # this direct-mode command should create an ASCII listing on DH0.
          printf 'LIST "DH0:stdin-save.LST"\n' > amiga-volume/cli-input.txt
          cat > amiga-volume/S/Startup-Sequence <<'EOF'
          Echo "AMIGA CLI PROBE: BOOTED"
          CD CI:
          Run <DH0:cli-input.txt >DH0:cli-output.txt DH0:GFABasic - DH0:factzero.LST
          Echo "CLI launch command issued" >DH0:probe-status.txt
          EOF
          cp amiga-volume/factzero.LST artifacts/amiga-cli-probe/factzero.LST
          cp amiga-volume/cli-input.txt artifacts/amiga-cli-probe/cli-input.txt
          cp amiga-volume/S/Startup-Sequence artifacts/amiga-cli-probe/Startup-Sequence.txt
          cat > "$RUNNER_TEMP/amiga-cli-probe.uae" <<EOF
          use_gui=no
          cpu_type=68020
          chipset=ecs
          chipmem_size=2
          fastmem_size=8
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          filesystem2=rw,DH0:CI:$GITHUB_WORKSPACE/amiga-volume,0
          EOF

      - name: Run CLI and redirected-stdin experiment
        run: |
          set -euo pipefail
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/amiberry.log"
          export SCREENSHOT="$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/editor-after-cli-launch.png"
          export SDL_AUDIODRIVER=dummy
          env -u SHELLOPTS xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -c '
            set -eo pipefail
            amiberry -G -f "$RUNNER_TEMP/amiga-cli-probe.uae" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() { kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            ipc_socket_path=""
            for attempt in $(seq 1 45); do
              ipc_socket_path="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$ipc_socket_path" ]; then break; fi
              sleep 1
            done
            test -n "$ipc_socket_path" || { cat "$AMIBERRY_LOG"; exit 1; }
            sleep 35
            printf "SCREENSHOT\\t%s\\n" "$SCREENSHOT" | timeout 5s nc -U -N "$ipc_socket_path"
            kill -0 "$emulator_pid"
            printf "QUIT\\n" | timeout 5s nc -U -N "$ipc_socket_path" || true
          '
          test -s "$SCREENSHOT"
          tesseract "$SCREENSHOT" stdout 2>/dev/null | tee artifacts/amiga-cli-probe/editor-ocr.txt
          if grep -Eiq 'FACT|PRINT|x[[:space:]]*=' artifacts/amiga-cli-probe/editor-ocr.txt; then
            echo "CLI_LST_VISIBLE=yes" | tee artifacts/amiga-cli-probe/result.txt
          else
            echo "CLI_LST_VISIBLE=no" | tee artifacts/amiga-cli-probe/result.txt
          fi
          if test -s amiga-volume/stdin-save.LST; then
            echo "REDIRECTED_STDIN_LIST_SAVE=yes" | tee -a artifacts/amiga-cli-probe/result.txt
            cp amiga-volume/stdin-save.LST artifacts/amiga-cli-probe/stdin-save.LST
          else
            echo "REDIRECTED_STDIN_LIST_SAVE=no" | tee -a artifacts/amiga-cli-probe/result.txt
          fi
          if test -f amiga-volume/cli-output.txt; then
            cp amiga-volume/cli-output.txt artifacts/amiga-cli-probe/cli-output.txt
          fi
          if test -f amiga-volume/probe-status.txt; then
            cp amiga-volume/probe-status.txt artifacts/amiga-cli-probe/probe-status.txt
          fi

      - name: Upload diagnostic evidence (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-cli-stdin-probe
          path: artifacts/amiga-cli-probe/
          if-no-files-found: warn
          retention-days: 7
