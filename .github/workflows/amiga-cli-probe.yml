name: Amiga GFA BASIC CLI/stdin probe

on:
  push:
    branches:
      - "experiment/amiga-cli-stdin-probe"
    paths:
      - ".github/workflows/amiga-cli-probe.yml"
  pull_request:
    paths:
      - ".github/workflows/amiga-cli-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amiga-cli-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and verify private GFA BASIC interpreter
        env:
          GFA_ASSETS_TOKEN: ${{ secrets.GFA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GFA_ASSETS_TOKEN"
          mkdir -p amiga-volume/S artifacts/amiga-cli-probe
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GFA_ASSETS_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/vsimko/gfabasic-private-assets/contents/GFABasic?ref=main" \
            --output amiga-volume/GFABasic
          echo "fd80f6093e8d0163856af5849121e945e37051a2ad2a9053aa1930021783d962  amiga-volume/GFABasic" | sha256sum --check
          test "$(wc -c < amiga-volume/GFABasic)" -eq 136548
          printf '\x00\x00\x03\xf3' | cmp -n 4 - amiga-volume/GFABasic
          file amiga-volume/GFABasic | tee artifacts/amiga-cli-probe/binary-info.txt
          strings -a amiga-volume/GFABasic | grep -i -E 'MERGE|SAVE|LIST|DOSCMD|GFA.BASIC' | head -80 > artifacts/amiga-cli-probe/binary-strings.txt || true

      - name: Install emulator and OCR
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.amiberry.com/gpg.key | sudo tee /usr/share/keyrings/amiberry-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/amiberry-archive-keyring.gpg] https://packages.amiberry.com/apt noble main" | sudo tee /etc/apt/sources.list.d/amiberry.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends amiberry xvfb netcat-openbsd tesseract-ocr
          amiberry --version | tee artifacts/amiga-cli-probe/amiberry-version.txt

      - name: Prepare CLI input and boot volume
        run: |
          cat > amiga-volume/factzero.LST <<'EOF'
          x = FACT(0)
          y = FACT(1)
          z = FACT(2)
          PRINT x, y, z
          EOF
          # If the process attaches its standard input to a command console,
          # this direct-mode command should create an ASCII listing on DH0.
          printf 'LIST "GFA:stdin-save.LST"\n' > amiga-volume/cli-input.txt
          cat > amiga-volume/S/Startup-Sequence <<'EOF'
          Echo "AMIGA CLI PROBE: BOOTED"
          Wait 3
          CD GFA:
          List GFA: >GFA:gfa-directory-check.txt
          List GFA:factzero.LST >GFA:gfa-file-check.txt
          Run <GFA:cli-input.txt >GFA:cli-output.txt GFA:GFABasic
          Echo "CLI launch without program argument" >GFA:probe-status.txt
          EOF
          cp amiga-volume/factzero.LST artifacts/amiga-cli-probe/factzero.LST
          cp amiga-volume/cli-input.txt artifacts/amiga-cli-probe/cli-input.txt
          cp amiga-volume/S/Startup-Sequence artifacts/amiga-cli-probe/Startup-Sequence.txt
          cat > "$RUNNER_TEMP/amiga-cli-probe.uae" <<EOF
          use_gui=no
          cpu_type=68020
          chipset=ecs
          chipmem_size=2
          fastmem_size=8
          bogomem_size=0
          gfx_width=640
          gfx_height=512
          gfx_fullscreen=false
          sound_output=0
          filesystem2=rw,GFA:GFAVol:$GITHUB_WORKSPACE/amiga-volume,0
          uaehf0=dir,rw,GFA:GFAVol:$GITHUB_WORKSPACE/amiga-volume,0
          EOF

      - name: Merge textual LST in the GFA BASIC editor
        run: |
          set -euo pipefail
          export AMIBERRY_LOG="$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/amiberry.log"
          export SDL_AUDIODRIVER=dummy
          env -u SHELLOPTS xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" bash -c '
            set +u
            set -eo pipefail
            amiberry -G -f "$RUNNER_TEMP/amiga-cli-probe.uae" --log >"$AMIBERRY_LOG" 2>&1 &
            emulator_pid=$!
            cleanup() { kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            ipc_socket_path=""
            for attempt in $(seq 1 45); do
              ipc_socket_path="$(find /run/user -type s -name amiberry.sock -print -quit 2>/dev/null || true)"
              if [ -n "$ipc_socket_path" ]; then break; fi
              sleep 1
            done
            test -n "$ipc_socket_path" || { cat "$AMIBERRY_LOG"; exit 1; }
            export IPC_SOCKET_PATH="$ipc_socket_path"
            sleep 35
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/editor-before-merge.png" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"

            # Amiga raw keycode 0x51 (decimal 81) is F2, the Editor Merge command.
            printf "SEND_KEY\\t81\\t1\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
            sleep 0.3
            printf "SEND_KEY\\t81\\t0\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
            sleep 3
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-dialog.png" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"

            # The Merge requester opens with its filename gadget focused.
            # Amiga raw keycodes spell "factzero.lst".
            send_key() {
              printf "SEND_KEY\\t%s\\t1\\n" "$1" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" >/dev/null
              sleep 0.15
              printf "SEND_KEY\\t%s\\t0\\n" "$1" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" >/dev/null
              sleep 0.15
            }
            # Replace the default volume prefix with the dedicated GFA: volume.
            send_key 70
            send_key 70
            for keycode in 36 35 32; do send_key "$keycode"; done
            printf "SEND_KEY\\t96\\t1\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" >/dev/null
            sleep 0.15
            printf "SEND_KEY\\t41\\t1\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" >/dev/null
            sleep 0.15
            printf "SEND_KEY\\t41\\t0\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" >/dev/null
            sleep 0.15
            printf "SEND_KEY\\t96\\t0\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" >/dev/null
            sleep 0.15
            for keycode in 35 32 51 20 49 18 19 24 57 40 33 20; do
              send_key "$keycode"
            done
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/merge-filename.png" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"

            # Click the left requester gadget (Merge), not the right Cancel gadget.
            # On the 768x512 capture it is centered near (323, 426).
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/before-merge-click.png" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
            # SEND_MOUSE deltas are capped by the input bridge; move in smaller steps.
            for delta in "100 100" "100 100" "45 100" "0 88"; do
              set -- $delta
              printf "SEND_MOUSE\\t%s\\t%s\\t0\\n" "$1" "$2" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
              sleep 0.2
            done
            sleep 0.3
            printf "SEND_MOUSE\\t0\\t0\\t1\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
            sleep 0.3
            printf "SEND_MOUSE\\t0\\t0\\t0\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
            sleep 5
            printf "SCREENSHOT\\t%s\\n" "$GITHUB_WORKSPACE/artifacts/amiga-cli-probe/after-merge.png" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}"
            kill -0 "$emulator_pid"
            printf "QUIT\\n" | timeout 5s nc -U -N "${IPC_SOCKET_PATH}" || true
          '
          for diagnostic in gfa-directory-check.txt gfa-file-check.txt cli-output.txt probe-status.txt stdin-save.LST; do
            if test -f "amiga-volume/$diagnostic"; then
              cp "amiga-volume/$diagnostic" "artifacts/amiga-cli-probe/$diagnostic"
            else
              printf "MISSING: %s\\n" "$diagnostic" > "artifacts/amiga-cli-probe/$diagnostic.missing"
            fi
          done
          for screenshot in editor-before-merge.png merge-dialog.png merge-filename.png before-merge-click.png after-merge.png; do
            test -s "artifacts/amiga-cli-probe/$screenshot"
          done
          tesseract artifacts/amiga-cli-probe/after-merge.png stdout 2>/dev/null | tee artifacts/amiga-cli-probe/after-merge-ocr.txt
          if ! grep -Fqi 'Merge File' artifacts/amiga-cli-probe/after-merge-ocr.txt && grep -Eiq 'PRINT|^[[:space:]]*[xyz][[:space:]]*=' artifacts/amiga-cli-probe/after-merge-ocr.txt; then
            echo "EDITOR_MERGE_LST_CONTENT_VISIBLE=yes" | tee artifacts/amiga-cli-probe/result.txt
          else
            echo "EDITOR_MERGE_LST_CONTENT_VISIBLE=no" | tee artifacts/amiga-cli-probe/result.txt
            echo "::error::The editor screenshot does not show the merged LST source."
            exit 1
          fi

      - name: Upload diagnostic evidence (never upload commercial binary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: amiga-gfa-basic-cli-stdin-probe
          path: artifacts/amiga-cli-probe/
          if-no-files-found: warn
          retention-days: 7
