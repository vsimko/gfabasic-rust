schema-version = 1

# Language-core special variables and DATA-pointer operations documented in
# the Amiga GFA BASIC 3.5 interpreter addendum.
[[declarations]]
id = "gfa.language.data.data-pointer"
name = "_DATA"
kind = "variable"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "_DATA"
contexts = ["expression", "lvalue"]

[declarations.signature]
type = "integer DATA-pointer position"

[declarations.semantics]
summary = "Returns the current DATA-pointer position; returns 0 when the next READ would cause an out-of-data condition."
side-effects = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed p. 13-34 (same feature: combined update scan p. 14-5)"]
notes = ["The leading underscore in _DATA was checked against the addendum page image; ordinary DATA is a separate statement.", "The exact pointer numbering and behavior after every READ form are not fully specified by this short addendum passage."]

[declarations.implementation]
status = "not-implemented"

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
pending-reason = "No DATA-pointer implementation or executable reference-interpreter conformance tests are registered."

[declarations.docs]
path = "docs/research/amiga-gfa-basic-35-addendum-inventory.md"
anchors = ["4-additional-commands-in-version-35-combined-scan-chapter-14-printed-pp-14-1-14-7"]

[[declarations]]
id = "gfa.language.data.set-data-pointer"
name = "_DATA="
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "_DATA= integer-expression"
contexts = ["statement"]
arguments = [{ name = "position", type = "integer expression previously obtained from _DATA", required = true }]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Sets the DATA pointer to a value previously obtained with _DATA."
side-effects = ["Changes the current DATA-pointer position."]
errors = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed p. 13-34 (same feature: combined update scan p. 14-5)"]
notes = ["The leading underscore and equals sign in _DATA= were checked against the addendum page image.", "The source describes restoring a pointer value previously obtained from _DATA; it does not specify arbitrary pointer values."]

[declarations.implementation]
status = "not-implemented"

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
