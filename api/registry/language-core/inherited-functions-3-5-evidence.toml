name = "STR$"
kind = "function"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "STR$(arithmetic-expression, arithmetic-expression, arithmetic-expression)"
contexts = ["expression"]
arguments = [
  { name = "x", type = "arithmetic expression", required = true },
  { name = "y", type = "arithmetic expression", required = true },
  { name = "z", type = "arithmetic expression", required = true },
]

[declarations.signature]
returns = "string"

[declarations.semantics]
summary = "Converts a numeric value to a string; the 3.5 MAT PRINT description explicitly references the three-argument formatting form STR$(x,g,n)."
side-effects = []
errors = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35", "AM-BOOK-DE-1990"]
printed-pages = ["English addendum, Chapter 13, printed p. 13-3", "German 3.5 Chapter 18, printed p. 457", "Base-manual function definition, printed p. 2-15 (3.0-origin syntax/semantics only)"]
notes = ["The 3.5 source explicitly references STR$(x,g,n); the German 3.5 chapter independently corroborates the formatting reference. The one- and two-argument forms are not independently restated in 3.5 material."]

