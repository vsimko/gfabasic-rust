  { name = "i", type = "optional integer-expression destination row offset", required = false },
  { name = "j", type = "optional integer-expression destination column offset", required = false },
  { name = "k", type = "optional integer-expression source row offset", required = false },
  { name = "l", type = "optional integer-expression source column offset", required = false },
  { name = "h", type = "optional integer-expression copy height", required = false },
  { name = "w", type = "optional integer-expression copy width", required = false },
]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Copies a selected source region to the destination while transposing source rows and columns. The source field remains unchanged."
side-effects = ["Writes the transposed region into the destination field."]
errors = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed pp. 13-15–13-19"]
notes = ["The page-image-reviewed material documents source preservation, matching-index behavior, and the vector-specific row/column requirements.", "For vector operands, one vector must be explicitly dimensioned as a row vector and the other as a column vector; the command transposes the second vector before copying.", "For vector extents, the effective dimension depends on source orientation; zero in the active extent performs no copy."]

