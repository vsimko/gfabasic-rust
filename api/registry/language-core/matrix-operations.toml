[[declarations]]
id = "gfa.language.matrix.mat-cpy"
name = "MAT CPY"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "MAT CPY destination([i,j])=source([k,l])[,h,w]"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" },
  { name = "source", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" },
  { name = "i", type = "optional integer-expression destination row offset", required = false },
  { name = "j", type = "optional integer-expression destination column offset", required = false },
  { name = "k", type = "optional integer-expression source row offset", required = false },
  { name = "l", type = "optional integer-expression source column offset", required = false },
  { name = "h", type = "optional integer-expression copy height", required = false },
  { name = "w", type = "optional integer-expression copy width", required = false },
]

[[declarations.syntax]]
form = "MAT CPY destination()=source()"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "previously dimensioned floating-point field", required = true, passing = "array" },
  { name = "source", type = "previously dimensioned floating-point field", required = true, passing = "array" },
]

[[declarations.syntax]]
form = "MAT CPY destination(i,j)=source()"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "previously dimensioned floating-point field", required = true, passing = "array" },
  { name = "i", type = "integer-expression destination row offset", required = true },
  { name = "j", type = "integer-expression destination column offset", required = true },
  { name = "source", type = "previously dimensioned floating-point field", required = true, passing = "array" },
]

[[declarations.syntax]]
form = "MAT CPY destination()=source(k,l)"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "previously dimensioned floating-point field", required = true, passing = "array" },
  { name = "source", type = "previously dimensioned floating-point field", required = true, passing = "array" },
  { name = "k", type = "integer-expression source row offset", required = true },
  { name = "l", type = "integer-expression source column offset", required = true },
]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Copies a rectangular region from a source vector/matrix to a destination field. Optional offsets select source and destination positions; optional h and w select the copied extent. Shorthand forms copy the overlapping elements whose indices exist in both fields."
side-effects = ["Writes the selected destination elements; existing destination values in the copied region are replaced."]
errors = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed pp. 13-4–13-19"]
notes = ["The page-image-reviewed material documents region offsets, extents, overlapping-index shorthand, and vector-specific forms.", "For vector operands, MAT CPY treats both vectors syntactically as column vectors; the documented syntax uses dimensions (n,1).", "For MAT CPY optional vector extents, w>=1 makes only h relevant and w=0 performs no copy."]

[declarations.implementation]
status = "not-implemented"

