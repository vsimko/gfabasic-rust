[[declarations]]
id = "gfa.language.matrix.mat-add"
name = "MAT ADD"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "MAT ADD destination()=left()+right()"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "floating-point matrix or vector", required = true, passing = "array" },
  { name = "left", type = "floating-point matrix or vector", required = true, passing = "array" },
  { name = "right", type = "floating-point matrix or vector", required = true, passing = "array" },
]

[[declarations.syntax]]
form = "MAT ADD destination(),source()"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "floating-point matrix or vector", required = true, passing = "array" },
  { name = "source", type = "floating-point matrix or vector", required = true, passing = "array" },
]

[[declarations.syntax]]
form = "MAT ADD destination(),scalar"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "floating-point matrix or vector", required = true, passing = "array" },
  { name = "scalar", type = "numeric scalar expression", required = true },
]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Adds matrices/vectors element by element, or adds a scalar to every element. The three-field form writes the result to a destination; the two-argument forms mutate the destination in place. Array operands in the element-wise forms must have the same order."
side-effects = ["The in-place forms replace the original destination values."]
errors = []

