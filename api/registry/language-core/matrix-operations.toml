contexts = ["statement"]
arguments = [
  { name = "channel", type = "optional output channel", required = false },
  { name = "array", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" },
  { name = "g", type = "optional integer-expression formatting width", required = false },
  { name = "n", type = "optional integer-expression decimal places", required = false },
]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Outputs a vector on one row with comma-separated elements, or a matrix with a rowfeed after each row. Output may be redirected to a channel; optional g and n formatting follows STR$(x,g,n)."
