[[declarations]]
id = "gfa.language.matrix.mat-read"
name = "MAT READ"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "MAT READ array()"
contexts = ["statement"]
arguments = [{ name = "array", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" }]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Reads a previously dimensioned vector or matrix from DATA rows."
side-effects = ["Writes sequential DATA values into the supplied field."]
errors = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
