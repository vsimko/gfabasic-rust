[[declarations]]
id = "gfa.language.math.variat"
name = "VARIAT"
kind = "function"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "VARIAT(integer-expression, integer-expression)"
contexts = ["expression"]
arguments = [
  { name = "n", type = "integer expression", required = true },
  { name = "k", type = "integer expression", required = true },
]

[declarations.signature]
returns = "arithmetic expression"

[declarations.semantics]
summary = "Returns the number of k-permutations of n elements without repetition: n!/(n-k)!."
errors = []
side-effects = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35", "AM-BOOK-DE-1990"]
printed-pages = ["Chapter 13, printed pp. 13-33–13-34 (same feature: combined update scan pp. 14-1–14-2)", "Chapter 19.1, printed pp. 478–479 (explicit 3.5 additions)"]
notes = ["The 3.5 addendum page images were checked. Both arguments are documented as integer expressions.", "The companion German book explicitly places VARIAT among the 3.5 additions, defines permutations without repetition as n!/(n-k)!, and states that n >= k is required for the function to be defined (printed p. 478). Both inputs are integer values; behavior for negative or fractional inputs and numeric overflow remains unspecified.", "The compiler prototype evaluates only a restricted literal subset. Partial typed runtime helpers are mapped by stable registry handler IDs, but their overflow/error behavior is not yet conformant or verified."]

