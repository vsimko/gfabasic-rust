schema-version = 1

# This first Amiga catalogue slice contains only features explicitly identified
# in the Amiga GFA BASIC 3.5 interpreter addendum. Base-manual 3.0 features are
# intentionally excluded until their 3.5 applicability is reviewed.

[[declarations]]
id = "gfa.language.math.fact"
name = "FACT"
kind = "function"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]

[[declarations.syntax]]
form = "FACT(integer-expression)"
contexts = ["expression"]
arguments = [{ name = "n", type = "integer expression", required = true }]

[declarations.signature]
returns = "arithmetic expression"

[declarations.semantics]
summary = "Returns the factorial n!; the addendum explicitly defines 0! as 1."
errors = []
side-effects = []

[declarations.evidence]
source-scope = "amiga-3.5-addendum"
status = "book-documented"
sources = ["AM-INTERPRETER-35", "AM-BOOK-DE-1990"]
printed-pages = ["Chapter 13, printed pp. 13-33–13-34 (same feature: combined update scan pp. 14-1–14-2)", "Chapter 19.1, printed pp. 477–478 (explicit 3.5 additions)"]
notes = ["The 3.5 addendum page images were checked. The source describes an integer-expression argument and explicitly defines 0! = 1. On printed p. 13-33 the worked example spells the call `FAXT(6)`, while the syntax and definition identify `FACT`; this is treated as an apparent source typo, not an alias or separate declaration.", "The companion German book explicitly places FACT among the 3.5 additions and says the function is defined only for integer values; it defines 0! = 1, describes n! as the product from n down to 1, and demonstrates FACT(421) (printed pp. 477–478). The FACT(421) output is printed as 4.967094384179E+923. This is a demonstrated input/result, not a stated maximum; behavior for negative, fractional, or larger inputs and the overflow boundary remain unspecified.", "The compiler prototype evaluates only a restricted literal subset. Partial typed runtime helpers are mapped by stable registry handler IDs, but their overflow/error behavior is not yet conformant or verified."]

[declarations.implementation]
status = "partial"
handler = "gfa.language.math.fact"
notes = ["The runtime exposes a typed exact-arithmetic helper for this operation. The helper is partial: it returns no value outside the u32 input/u128 result domain, while the original interpreter's overflow and error behavior remains unverified. The compiler prototype still restricts source expressions to its documented literal subset."]

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
pending-reason = "No complete implementation or executable reference-interpreter conformance suite is registered."

