id = "gfa.amiga.matrix.mat-clr"
name = "MAT CLR"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "MAT CLR array()"
contexts = ["statement"]
arguments = [{ name = "array", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" }]

[declarations.semantics]
summary = "Sets every element of the specified vector or matrix to zero."
side-effects = ["Mutates every element of the supplied floating-point field."]
errors = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed p. 13-3"]
notes = ["Chapter 13 restricts these operations to one- and/or two-dimensional fields with floating-point variables.", "The addendum equates MAT CLR with ARRAYFILL array(),0."]

[declarations.implementation]
status = "not-implemented"

