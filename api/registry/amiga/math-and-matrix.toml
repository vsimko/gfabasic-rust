[[declarations]]
id = "gfa.amiga.matrix.mat-norm"
name = "MAT NORM"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "MAT NORM array(), 0 | 1"
contexts = ["statement"]
arguments = [
  { name = "array", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" },
  { name = "mode", type = "integer literal 0 (rows) or 1 (columns)", required = true },
]

[declarations.semantics]
summary = "Normalizes each row when mode is 0, or each column when mode is 1, so the sum of squares of the elements in each normalized vector is 1."
side-effects = ["Scales matrix elements in place."]
errors = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed pp. 13-31–13-33"]
notes = ["The row/column meanings of modes 0 and 1 were checked against the addendum page images.", "A page-image-verified row-normalization research fixture exists but is not an executable conformance test."]

[declarations.implementation]
status = "not-implemented"

