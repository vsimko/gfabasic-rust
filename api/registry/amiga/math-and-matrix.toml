schema-version = 1

# This first Amiga catalogue slice contains only features explicitly identified
# in the Amiga GFA BASIC 3.5 interpreter addendum. Base-manual 3.0 features are
# intentionally excluded until their 3.5 applicability is reviewed.

[[declarations]]
id = "gfa.amiga.math.fact"
name = "FACT"
kind = "function"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "FACT(integer-expression)"
contexts = ["expression"]
arguments = [{ name = "n", type = "integer expression", required = true }]

[declarations.signature]
returns = "arithmetic expression"

[declarations.semantics]
summary = "Returns the factorial n!; the addendum explicitly defines 0! as 1."
errors = []
side-effects = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed pp. 13-33–13-34 (same feature: combined update scan pp. 14-1–14-2)"]
notes = ["The 3.5 addendum page images were checked. The source describes an integer-expression argument and explicitly defines 0! = 1.", "The existing prototype evaluates only a restricted literal subset; it has no stable registry handler mapping and is not a complete implementation."]

[declarations.implementation]
status = "not-implemented"
notes = ["A restricted compile-time literal prototype exists in crates/gfabasic-compiler/src/prototype.rs; it is not a complete runtime implementation or a registry-linked handler."]

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
pending-reason = "No complete implementation or executable reference-interpreter conformance suite is registered."

[declarations.docs]
path = "docs/research/amiga-gfa-basic-35-addendum-inventory.md"
anchors = ["4-additional-commands-in-version-35-combined-scan-chapter-14-printed-pp-14-1-14-7"]

