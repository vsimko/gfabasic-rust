[[declarations]]
id = "gfa.amiga.matrix.mat-trans"
name = "MAT TRANS"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "MAT TRANS destination() [= source()]"
contexts = ["statement"]
arguments = [
  { name = "destination", type = "previously dimensioned one- or two-dimensional floating-point field", required = true, passing = "array" },
  { name = "source", type = "previously dimensioned one- or two-dimensional floating-point field", required = false, passing = "array" },
]

[declarations.semantics]
summary = "Transposes a square matrix in place when the source is omitted, or copies the transpose of source into destination."
side-effects = ["Mutates the destination field; the in-place form also reads and rewrites the same field."]
errors = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed pp. 13-19–13-20"]
notes = ["The two-operand form requires compatible reversed dimensions; if source is n×m, destination must be m×n.", "A page-image-verified research fixture exists but is not an executable conformance test."]

[declarations.implementation]
status = "not-implemented"

