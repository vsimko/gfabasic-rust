[[declarations]]
id = "gfa.amiga.matrix.mat-base"
name = "MAT BASE"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "MAT BASE 0 | MAT BASE 1"
contexts = ["statement"]
arguments = [{ name = "base", type = "integer literal 0 or 1", required = true }]

[declarations.semantics]
summary = "Sets the row/column index offset used by the documented matrix operations; the default is 1."
side-effects = ["Changes the matrix-operation index base for MAT READ, MAT PRINT, MAT CPY, MAT XCPY, MAT ADD, MAT SUB, and MAT MUL."]
errors = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed pp. 13-1–13-2"]
notes = ["The page-image-reviewed addendum says MAT BASE 1 is the default and documents explicit settings 0 and 1."]

[declarations.implementation]
status = "not-implemented"

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
pending-reason = "No matrix-operation runtime or executable reference-interpreter conformance tests are registered."

