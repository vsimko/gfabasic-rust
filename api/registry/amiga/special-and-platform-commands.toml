schema-version = 1

# Amiga-specific display, window, and GURU system operations documented in
# the GFA BASIC 3.5 interpreter addendum.
[[declarations]]
id = "gfa.amiga.graphics.pcolor"
name = "PCOLOR"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "PCOLOR foreground[, background]"
contexts = ["statement"]
arguments = [
  { name = "foreground", type = "COLOR-compatible foreground colour value", required = true },
  { name = "background", type = "optional COLOR-compatible background colour value", required = false },
]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Sets the foreground and optional background colours for screen output subsequently produced by PRINT; the command is described as otherwise behaving like COLOR."
side-effects = ["Changes colour state used by PRINT screen output."]
errors = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed p. 13-34 (same feature: combined update scan p. 14-4)"]
notes = ["The source documents PCOLOR foreground,background and examples with the background omitted.", "The colour value range and exact interaction with all screen/window modes are not specified in this addendum passage."]

[declarations.implementation]
status = "not-implemented"

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
pending-reason = "No PRINT colour-state implementation or executable reference-interpreter conformance tests are registered."

[declarations.docs]
path = "docs/research/amiga-gfa-basic-35-addendum-inventory.md"
anchors = ["4-additional-commands-in-version-35-combined-scan-chapter-14-printed-pp-14-1-14-7"]

[[declarations]]
id = "gfa.amiga.windows.openw-negative-screen"
name = "OPENW"
kind = "statement"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "OPENW with a negative screen number"
contexts = ["statement"]
arguments = [{ name = "screen-number", type = "negative screen number", required = true }]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "When the screen number is negative, opens the window on the current (top) screen."
side-effects = ["Creates a window on the current top screen."]
errors = []

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed p. 13-34 (same feature: combined update scan p. 14-3)"]
