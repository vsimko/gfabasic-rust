[[declarations]]
id = "gfa.amiga.system.guru-check"
name = "GURU"
kind = "statement"
overload-group = "gfa.amiga.system.guru"

[[declarations.availability]]
dialect = "amiga-gfa-basic-interpreter"
versions = ["3.5"]
profile = "amiga"

[[declarations.syntax]]
form = "GURU numeric-expression"
contexts = ["statement"]
arguments = [{ name = "enable", type = "numeric expression", required = true }]

[declarations.signature]
type = "no return value"

[declarations.semantics]
summary = "Disables GURU checking when the argument is 0 and enables it when the argument is nonzero. On a GURU Meditation, control transfers to ONERROR GOSUB or error #109 is generated."
side-effects = ["Changes GURU-checking state.", "May transfer control to ONERROR GOSUB or raise error #109 on a GURU Meditation."]
errors = ["Error #109: GURU Meditation", "Errors #110–#118: normal GURU conditions $2–$A"]

[declarations.evidence]
status = "book-documented"
sources = ["AM-INTERPRETER-35"]
printed-pages = ["Chapter 13, printed p. 13-36 (same feature: combined update scan pp. 14-6–14-7)"]
notes = ["The 3.5 addendum distinguishes the GURU command from the GURU function. Error messages #110–#118 correspond to normal GURUs $2–$A.", "In compiled 3.5 programs, RESUME NEXT and RESUME LABEL cannot be executed after an ONERROR GOSUB call caused by a GURU; this restriction is recorded in the source inventory."]

[declarations.implementation]
status = "not-implemented"

[[declarations.support]]
target = "x86_64-unknown-linux-gnu"
classification = "unknown"
conformance = "not-tested"
tests = []
pending-reason = "No Amiga GURU/error handling implementation or executable reference-interpreter conformance tests are registered."

